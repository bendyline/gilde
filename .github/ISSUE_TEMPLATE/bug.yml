name: Catalog bug
description: Something in the catalog data is wrong
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: item
    attributes:
      label: Which item?
      placeholder: e.g. data/chat-models/ge/gemma4-12b-q4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: Wrong sha256, broken download, bad tuning, stale description, failing craftbook step...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
