name: Craftbook idea
description: Propose a new craftbook before writing it
title: "[craftbook] "
labels: [craftbook, idea]
body:
  - type: input
    id: task
    attributes:
      label: What task should it accomplish?
      placeholder: e.g. turn a folder of meeting notes into a weekly digest
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Rough step outline
      description: A few bullets — what would the gezel do, in what order?
    validations:
      required: true
  - type: input
    id: toolsets
    attributes:
      label: Toolsets it would need
      placeholder: e.g. workspace files, web-search
  - type: textarea
    id: eval
    attributes:
      label: How would we know it worked?
      description: This becomes the test.json eval sidecar.
