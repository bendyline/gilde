name: Model addition or update
description: Propose a new local model entry or a fix to an existing one
title: "[model] "
labels: [model]
body:
  - type: input
    id: hf-repo
    attributes:
      label: Hugging Face repo
      placeholder: e.g. unsloth/gemma-4-12b-it-GGUF
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Upstream license
      placeholder: e.g. apache-2.0, gemma
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: What kind of change?
      options:
        - New model entry
        - New version of an existing entry
        - Tuning fix
        - Metadata fix
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Quantization, engines (llama.cpp / MLX), context window, anything you have verified locally.
