name: Dispatch pipeline

# Every push to main pokes the gilde-pipeline repo, which verifies this
# repo, publishes @bendyline/gilde to npm, and redeploys gezelgilde.com.
# Secrets stay one-directional: this community-facing repo holds only
# PIPELINE_DISPATCH_TOKEN (a fine-grained PAT with Contents R/W on
# bendyline/gilde-pipeline and nothing else); the pipeline repo holds
# the npm token and Pages rights.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          repository: bendyline/gilde-pipeline
          event-type: gilde-updated
          client-payload: '{"sha": "${{ github.sha }}"}'
