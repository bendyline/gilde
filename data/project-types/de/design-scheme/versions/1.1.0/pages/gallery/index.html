<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Design scheme</title>
    <style>
      :root { color-scheme: light dark; --bg: #faf7f2; --card: #fff; --ink: #2b2620; --muted: #7a7166; --line: #ece5da; --accent: #8a5a2b; }
      :root[data-theme='dark'] { --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c; --line: #3a352f; --accent: #e0894a; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) { --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c; --line: #3a352f; --accent: #e0894a; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 var(--font-body, system-ui, sans-serif); background: var(--bg); color: var(--ink); padding: 2rem 1.25rem; }
      main { max-width: 720px; margin: 0 auto; }
      h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
      .sub { color: var(--muted); margin: 0 0 1.5rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      .swatches { display: flex; height: 84px; border-bottom: 1px solid var(--line); }
      /* A hairline between swatches keeps a near-white color visible against the white card. */
      .swatches > span { flex: 1; box-shadow: inset -1px 0 0 color-mix(in srgb, var(--ink) 10%, transparent); }
      .swatches > span:last-child { box-shadow: none; }
      .card .head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.6rem 0.85rem 0.3rem; }
      .card .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
      .card .hexes { display: flex; flex-wrap: wrap; gap: 0.1rem 0.75rem; padding: 0 0.85rem 0.75rem; color: var(--ink); font-size: 0.85rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .card .hexes > span { white-space: nowrap; user-select: all; }
      .key { flex: none; min-height: 32px; padding: 0.2rem 0.7rem; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); cursor: pointer; font: inherit; font-size: 0.85rem; }
      .key:hover { border-color: var(--muted); }
      .empty { color: var(--muted); font-style: italic; }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-banner strong { font-weight: 700; }
      .demo-reset {
        flex: none;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      .demo-reset:hover { border-color: var(--ink); }
    </style>
  <style>
 [hidden]{display:none!important}body{font-family:var(--font-body,system-ui,sans-serif);line-height:1.5}h1,h2,h3{font-family:var(--font-heading,Georgia,serif)}button,input,select,textarea{font-family:var(--font-ui,system-ui,sans-serif)}:focus-visible{outline:3px solid var(--accent,#a65334);outline-offset:3px}main{min-width:0}.app-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:24px 0;align-items:start}.app-search{margin:20px 0;max-width:540px}.app-problem{padding:12px;border:1px solid currentColor;border-radius:6px;overflow-wrap:anywhere}.app-section-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.app-section-nav a{padding:8px 12px;border:1px solid var(--border,#92816a);border-radius:6px;color:inherit;text-decoration:none;font-size:14px}.app-section-nav a:hover{background:color-mix(in srgb,currentColor 8%,transparent)}html[data-gezel-fullscreen=true] main>h1{font-size:clamp(28px,3vw,40px);margin-top:0}html[data-gezel-fullscreen=true] .board{min-width:0}main section{scroll-margin-top:16px}@media(max-width:620px){main{padding:16px!important}.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.board,.columns{max-width:100%;overflow-x:auto}h1{overflow-wrap:anywhere}button{min-height:40px}}</style>
    <style data-app-shell="2">
    /* Shared app furniture from the Gezel app UX guide. The page owns everything else. */
    :root{--app-action:var(--gezel-component-accent,#805128);--app-on-action:#fffaf3;--app-banner-bg:#f3eddf;--app-banner-line:#d6cbb8}
    :root[data-theme=dark]{--app-action:var(--gezel-component-accent,#e0b78b);--app-on-action:#1f1a16;--app-banner-bg:#25221f;--app-banner-line:#4a4238}
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--app-action:var(--gezel-component-accent,#e0b78b);--app-on-action:#1f1a16;--app-banner-bg:#25221f;--app-banner-line:#4a4238}}
    main h1{font-weight:400}
    html[data-gezel-fullscreen=true] main h1{font-size:clamp(28px,3vw,40px);margin-top:0}
    .app-tabs{margin:20px 0 24px}
    .app-actionbar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;margin:16px 0 24px}
    .app-panel>.app-actionbar:first-child{margin-top:0}
    .app-settings{display:grid;gap:16px;max-width:760px;margin:0 0 24px}
    .app-search{margin:0}
    .app-search gezel-collection-filter{margin:0 0 12px;max-width:540px}
    .app-primary{min-height:44px;padding:8px 16px;border:1px solid var(--app-action);border-radius:6px;background:var(--app-action);color:var(--app-on-action);font-weight:600}
    .app-primary:disabled{display:none}
    main li.empty{display:block;grid-column:1/-1}
    html[data-app-legacy] [data-app-action]{display:none!important}
    [data-gezel-demo-banner]:not([hidden]){display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 16px;padding:8px 8px 8px 14px;border:1px solid var(--app-banner-line);border-radius:10px;background:var(--app-banner-bg);color:inherit;font-size:14px;line-height:1.4}
    [data-gezel-demo-banner] button{min-height:32px;padding:4px 12px;border:1px solid var(--app-banner-line);border-radius:6px;background:transparent;color:inherit;font-size:13px}
    @media(max-width:620px){.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}:is(.tiles,.stats,.summary):has(>:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))!important}:is(.tiles,.stats,.summary):has(>:only-child){grid-template-columns:minmax(0,1fr)!important}}
    </style>
  <script>
var appDisposed=false,appLoadRevision=0,appSubscriptions=[];
function reportAppError(error){var output=document.getElementById('app-load-error');if(output){output.hidden=!error;output.textContent=error?'Could not refresh this view. '+(error.message||'Try again.'):'';}}
window.addEventListener('pagehide',function(){appDisposed=true;appLoadRevision++;appSubscriptions.forEach(function(stop){stop();});},{once:true});
</script><style>#grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}.palette-preview{margin:12px;padding:20px 24px;border-radius:6px}.palette-preview strong{display:block;font:400 22px/1.25 var(--font-heading,Georgia,serif)}.palette-preview p{font-size:15px;margin:8px 0 14px}.palette-preview .surface{padding:10px 12px;border-radius:6px;font-size:14px}.palette-preview .accent{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:4px;font:600 13px var(--font-ui,system-ui,sans-serif)}.card{overflow:hidden}</style></head>
  <body>
    <main>
<p class="app-problem" id="app-load-error" role="status" hidden></p>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong> — sample data stays in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1>Design scheme</h1>
      <p class="sub" id="sub">Loading palettes…</p>
      <div class="grid" id="grid"></div>
    </main>
    <script src="demo-chat.js"></script>
    <script>
      (function () {
        'use strict';

        // ── demo schemes (used only when the page opens as a raw file) ──
        var demoSchemes = [
          { name: 'Warm Dusk', colors: ['#2B2620', '#8D694D', '#D5B58C', '#EFE4D1', '#FFF8E8'] },
          { name: 'Canal Morning', colors: ['#19323C', '#4F6D7A', '#9BB8B3', '#E7E3D4', '#F7F4EC'] },
          { name: 'Workshop Sage', colors: ['#26352D', '#557A5B', '#A7B89A', '#DDD5BF', '#FAF7F2'] },
        ];

        window.gezel || window.makeDemoGezel({
          page: { entry: 'gallery/index.html', typeName: 'Design Scheme', params: { brief: 'a new brand' } },
          tools: {
            // Like the scheme-store script: a palette with the same name replaces the saved one.
            page_save_scheme: function (input) {
              var name = String(input.name || '').trim();
              var colors = Array.isArray(input.colors) ? input.colors.map(String) : [];
              if (!name || !colors.length) throw new Error('A palette needs a name and at least one color.');
              var slug = function (text) { return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); };
              var at = demoSchemes.findIndex(function (s) { return slug(s.name) === slug(name); });
              if (at >= 0) demoSchemes[at] = { name: name, colors: colors };
              else demoSchemes.push({ name: name, colors: colors });
              return { count: demoSchemes.length, message: 'Saved "' + name + '" (' + colors.length + ' colors). ' + demoSchemes.length + ' scheme(s) total.' };
            },
          },
          data: {
            'schemes/index.json': function () { return { schemes: demoSchemes }; },
          },
          chat: window.demoChat,
        });

        // ── one code path from here: window.gezel exists in every mode ──
        var demoMode = gezel.page.mode === 'demo';

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        appSubscriptions.push(gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); }));

        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function el(tag, text, className) {
          var node = document.createElement(tag);
          if (text !== undefined) node.textContent = text;
          if (className) node.className = className;
          return node;
        }
        function isHex(c) { return typeof c === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(c); }
        function rgb(hex) {
          var h = hex.slice(1);
          if (h.length < 6) h = h.split('').map(function (c) { return c + c; }).join('');
          return [0, 2, 4].map(function (i) { return (parseInt(h.slice(i, i + 2), 16) || 0) / 255; });
        }
        function luminance(hex) {
          var c = rgb(hex).map(function (v) { return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
          return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
        }
        function saturation(hex) {
          var c = rgb(hex), max = Math.max.apply(null, c), min = Math.min.apply(null, c);
          return max === 0 ? 0 : (max - min) / max;
        }
        // Roles come from the colors themselves, not their order: the darkest is text, the lightest the
        // background, the next lightest a surface, and the most saturated of the rest the accent.
        function roles(colors) {
          var light = colors.slice().sort(function (a, b) { return luminance(a) - luminance(b); });
          var text = light[0], background = light[light.length - 1], rest = light.slice(1, -1);
          var surface = rest.length >= 2 ? rest[rest.length - 1] : null;
          var pool = surface ? rest.slice(0, -1) : rest;
          var accent = pool.length ? pool.slice().sort(function (a, b) { return saturation(b) - saturation(a); })[0] : text;
          return { text: text, background: background, surface: surface, accent: accent, onAccent: luminance(accent) > 0.35 ? text : background };
        }
        function preview(colors) {
          var r = roles(colors), box = el('div', undefined, 'palette-preview');
          box.setAttribute('aria-hidden', 'true');
          box.style.background = r.background;
          box.style.color = r.text;
          box.append(el('strong', 'Headline'), el('p', 'Body text on the background.'));
          if (r.surface) {
            var surface = el('div', 'A panel in the surface color', 'surface');
            surface.style.background = r.surface;
            box.append(surface);
          }
          var accent = el('span', 'Accent', 'accent');
          accent.style.background = r.accent;
          accent.style.color = r.onAccent;
          box.append(accent);
          return box;
        }
        function render(schemes) {
          var sub = document.getElementById('sub');
          var grid = document.getElementById('grid');
          var brief = gezel.page.params && typeof gezel.page.params.brief === 'string' ? gezel.page.params.brief.trim() : '';
          grid.replaceChildren();
          if (!schemes.length) {
            sub.textContent = 'No palettes yet. Make one, or ask the designer for a first direction.';
            return;
          }
          sub.textContent = schemes.length + (schemes.length === 1 ? ' palette' : ' palettes') + (brief ? ' for ' + brief : '') + '.';
          schemes.forEach(function (s) {
            var colors = Array.isArray(s.colors) ? s.colors.filter(isHex) : [];
            var name = s.name || 'Untitled';
            var card = el('div', undefined, 'card');
            var bars = el('div', undefined, 'swatches');
            colors.forEach(function (c) {
              var bar = el('span');
              bar.style.background = c;
              bars.append(bar);
            });
            var head = el('div', undefined, 'head');
            var edit = el('button', 'Edit', 'key');
            edit.type = 'button';
            edit.setAttribute('aria-label', 'Edit ' + name);
            edit.setAttribute('data-app-action', 'save_scheme');
            edit.setAttribute('data-app-values', JSON.stringify({ name: s.name || '', colors: colors.join(', ') }));
            head.append(el('div', name, 'name'), edit);
            var hexes = el('div', undefined, 'hexes');
            colors.forEach(function (c) { hexes.append(el('span', c.toUpperCase())); });
            card.append(bars, head, hexes);
            if (colors.length >= 2) card.append(preview(colors));
            grid.append(card);
          });
        }

        window.addEventListener('gezel-app-data-changed', function(){ loadSchemes(); });
        function loadSchemes() {
          var revision=++appLoadRevision;
          return gezel.data.read('schemes/index.json',{source:'artifacts'})
            .then(function(data){if(appDisposed||revision!==appLoadRevision)return;reportAppError(null);render(data&&Array.isArray(data.schemes)?data.schemes:[]);})
            .catch(function(error){if(!appDisposed&&revision===appLoadRevision)reportAppError(error);});
        }

        loadSchemes();
        appSubscriptions.push(gezel.data.watch('schemes/index.json', function () { loadSchemes(); }, { source: 'artifacts' }));
      })();
    </script>
  <script src="application.js" defer></script>
  </body>
</html>
