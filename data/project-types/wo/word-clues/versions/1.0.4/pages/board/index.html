<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Word Clues</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2;
        --card: #fff;
        --ink: #2b2620;
        --muted: #7a7166;
        --accent: #b5651d;
        --track: #ece5da;
        --good: #3d6b4b;
        --good-bg: #e3efe6;
        --warn: #974a26;
        --warn-bg: #f6e3d8;
      }
      :root[data-theme='dark'] {
        --bg: #1c1a17;
        --card: #262320;
        --ink: #efe9e0;
        --muted: #a59a8c;
        --accent: #e0894a;
        --track: #3a352f;
        --good: #7fae8d;
        --good-bg: #26352a;
        --warn: #d98a63;
        --warn-bg: #3b2a21;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1a17;
          --card: #262320;
          --ink: #efe9e0;
          --muted: #a59a8c;
          --accent: #e0894a;
          --track: #3a352f;
          --good: #7fae8d;
          --good-bg: #26352a;
          --warn: #d98a63;
          --warn-bg: #3b2a21;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.45 var(--font-body, system-ui, sans-serif);
        background: var(--bg);
        color: var(--ink);
        padding: 1.25rem 0.75rem;
      }
      main { max-width: 560px; margin: 0 auto; }
      h1 {
        font-family: var(--font-heading, Georgia, serif);
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0 0 0.15rem;
      }
      .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.85rem; }
      .clue {
        background: var(--card);
        border: 1px solid var(--track);
        border-radius: 10px;
        padding: 0.65rem 0.85rem;
        margin-bottom: 0.75rem;
        min-height: 3.2rem;
      }
      .clue strong { font-size: 1.15rem; letter-spacing: 0.04em; }
      .clue .muted { color: var(--muted); font-size: 0.85rem; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.4rem; }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--track);
        border-radius: 6px;
        min-height: 48px;
        padding: 0.35rem 0.25rem;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { cursor: default; }
      .actions button:disabled { opacity: 0.5; }
      .cell { font-size: 0.85rem; overflow-wrap: anywhere; text-transform: lowercase; }
      .cell.target { background: var(--good-bg); border-color: var(--good); color: var(--good); }
      .cell.trap { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
      .cell.neutral { color: var(--muted); text-decoration: line-through; }
      .cell.hidden-target { border-style: dashed; border-color: var(--good); }
      .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
      .actions button { padding: 0.35rem 0.9rem; }
      .stats { color: var(--muted); font-size: 0.85rem; margin-top: 0.75rem; }
      .banner {
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 0.45rem 0.7rem;
        font-size: 0.85rem;
        margin-bottom: 0.75rem;
      }
      .banner[hidden] { display: none; }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-reset { flex: none; min-height: 44px; padding: 0.25rem 0.6rem; }
    </style>
  <style>
 [hidden]{display:none!important}body{font-family:var(--font-body,system-ui,sans-serif);line-height:1.5}h1,h2,h3{font-family:var(--font-heading,Georgia,serif)}button,input,select,textarea{font-family:var(--font-ui,system-ui,sans-serif)}:focus-visible{outline:3px solid var(--accent,#a65334);outline-offset:3px}main{min-width:0}.app-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:24px 0;align-items:start}.app-search{margin:20px 0;max-width:540px}.app-problem{padding:12px;border:1px solid currentColor;border-radius:6px;overflow-wrap:anywhere}.app-section-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.app-section-nav a{padding:8px 12px;border:1px solid var(--border,#92816a);border-radius:6px;color:inherit;text-decoration:none;font-size:14px}.app-section-nav a:hover{background:color-mix(in srgb,currentColor 8%,transparent)}html[data-gezel-fullscreen=true] main>h1{font-size:clamp(28px,3vw,40px);margin-top:0}html[data-gezel-fullscreen=true] .board{min-width:0}main section{scroll-margin-top:16px}@media(max-width:620px){main{padding:16px!important}.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.board,.columns{max-width:100%;overflow-x:auto}h1{overflow-wrap:anywhere}button{min-height:40px}}</style>
  <script>
var appDisposed=false,appLoadRevision=0,appSubscriptions=[];
function reportAppError(error){var output=document.getElementById('app-load-error');if(output){output.hidden=!error;output.textContent=error?'Could not refresh this view. '+(error.message||'Try again.'):'';}}
window.addEventListener('pagehide',function(){appDisposed=true;appLoadRevision++;appSubscriptions.forEach(function(stop){stop();});},{once:true});
</script></head>
  <body>
    <main>
<p class="app-problem" id="app-load-error" role="status" hidden></p>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong>: you find the words and Pim gives the clues. Sample data stays in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1>Word Clues</h1>
      <p class="sub" id="sub">Find your six words. Steer clear of the trap.</p>
      <p class="banner" id="notice" hidden></p>
      <div class="clue" id="clue" aria-live="polite"></div>
      <div class="grid" id="grid"></div>
      <div class="actions">
        <button type="button" id="pass">Stop guessing</button>
        <button type="button" id="ask-again" hidden>Ask again</button>
        <button type="button" id="new-game">New game</button>
      </div>
      <p class="stats" id="stats"></p>
    </main>
    <script src="demo-chat.js"></script>
    <script>
      // Reads game.json (pages.reads) and plays through the page tools
      // new_game, guess, pass, and ask_clue_a / ask_clue_b, which summon the
      // clue-giver whose turn it is.
      (function () {
        'use strict';

        var GIVERS = { a: 'Clue Giver', b: 'Puzzler' };

        window.gezel || window.makeDemoGezel((function () {
          // ── standalone demo: the person guesses and Pim (demo-chat.js) gives every clue ──
          // Three dealt boards in a fixed order, so the sample plays the same way every time.
          var boards = [
            [['whale', 't'], ['lantern', 'n'], ['sail', 't'], ['piano', 'n'], ['volcano', 'x'], ['shell', 't'], ['carpet', 'n'], ['eagle', 'n'],
              ['cheese', 'n'], ['harbor', 't'], ['castle', 'n'], ['glove', 'n'], ['rocket', 't'], ['honey', 'n'], ['ladder', 'n'], ['wizard', 't']],
            [['tiger', 'n'], ['moon', 't'], ['bread', 't'], ['umbrella', 'n'], ['ghost', 'x'], ['grape', 't'], ['hammer', 'n'], ['owl', 't'],
              ['fence', 'n'], ['sock', 'n'], ['star', 't'], ['kettle', 'n'], ['bicycle', 'n'], ['cheese', 't'], ['wheel', 'n'], ['piano', 'n']],
            [['bridge', 'n'], ['snow', 't'], ['parrot', 'n'], ['violin', 't'], ['mirror', 'n'], ['scarf', 't'], ['fire', 'x'], ['pencil', 'n'],
              ['drum', 't'], ['apple', 'n'], ['tunnel', 'n'], ['ice', 't'], ['castle', 'n'], ['piano', 't'], ['basket', 'n'], ['bicycle', 'n']],
          ];
          var KINDS = { t: 'target', n: 'neutral', x: 'trap' };
          var dealt = 0;
          function cells(board) { return board.map(function (w) { return { word: w[0], kind: KINDS[w[1]], revealed: false }; }); }
          // The sample opens mid-game: SPACE found the rocket, and SEA is on the table.
          var demo = {
            version: 1,
            status: 'guessing',
            giver: 'a',
            round: 2,
            clue: { word: 'SEA', count: 3, guessesLeft: 4, giver: 'a' },
            words: cells(boards[0]),
            history: [{ round: 1, clue: 'SPACE', count: 1, found: ['rocket'] }, { round: 2, clue: 'SEA', count: 3, found: [] }],
            stats: { played: 3, won: 2, lost: 1 },
          };
          demo.words.find(function (w) { return w.word === 'rocket'; }).revealed = true;
          function left() { return demo.words.filter(function (w) { return w.kind === 'target' && !w.revealed; }); }
          // What the board tool shows the clue-giver, as the live engine does.
          function boardState() {
            return {
              status: demo.status,
              giver: demo.giver,
              result: '',
              display: '',
              modelState: {
                status: demo.status,
                yourWords: left().map(function (w) { return w.word; }),
                trap: (demo.words.find(function (w) { return w.kind === 'trap'; }) || {}).word || '',
                otherWords: demo.words.filter(function (w) { return w.kind === 'neutral' && !w.revealed; }).map(function (w) { return w.word; }),
                found: demo.words.filter(function (w) { return w.kind === 'target' && w.revealed; }).map(function (w) { return w.word; }),
                round: demo.round,
              },
              summary: 'Round ' + demo.round + ': ' + left().length + ' of 6 words still to find.',
            };
          }
          function clueProblem(clue, count) {
            var c = String(clue || '').trim().toLowerCase();
            if (!/^[a-z'-]{2,24}$/.test(c)) return 'A clue is one word of letters, like "ocean".';
            for (var i = 0; i < demo.words.length; i += 1) {
              var w = demo.words[i].word;
              if (w === c) return '"' + c + '" is on the board.';
              var shorter = c.length < w.length ? c : w, longer = c.length < w.length ? w : c;
              if (shorter.length >= 3 && longer.indexOf(shorter) === 0) return '"' + c + '" is a form of the board word "' + w + '".';
            }
            if (!(count >= 1 && count <= left().length && Math.floor(count) === count)) return 'The count must be a whole number from 1 to ' + left().length + '.';
            return '';
          }
          function giveClue(input) {
            if (demo.status !== 'clue_needed') throw new Error(demo.status === 'guessing' ? 'The player is still guessing; no clue is needed yet.' : 'The game is over. Offer a new game instead of a clue.');
            var count = Number(input.count);
            var problem = clueProblem(input.clue, count);
            if (problem) throw new Error(problem);
            var word = String(input.clue).trim().toUpperCase();
            demo.clue = { word: word, count: count, guessesLeft: count + 1, giver: demo.giver };
            demo.status = 'guessing';
            demo.round += 1;
            demo.history.push({ round: demo.round, clue: word, count: count, found: [] });
            var say = String(input.say || '').replace(/\s+/g, ' ').trim().slice(0, 160);
            var out = boardState();
            out.display = 'Clue: ' + word + ', ' + count + '.' + (say ? ' ' + say : '');
            return out;
          }
          function guess(input) {
            if (demo.status !== 'guessing') throw new Error('Wait for a clue before guessing.');
            var cell = demo.words.find(function (w) { return w.word === String(input.word || '').toLowerCase(); });
            if (!cell) throw new Error('"' + input.word + '" is not on the board.');
            if (cell.revealed) throw new Error('"' + cell.word + '" is already revealed.');
            cell.revealed = true;
            if (cell.kind === 'trap') demo.status = 'lost';
            else if (!left().length) demo.status = 'won';
            else if (cell.kind === 'neutral' || --demo.clue.guessesLeft <= 0) demo.status = 'clue_needed';
            if (cell.kind === 'target') demo.history[demo.history.length - 1].found.push(cell.word);
            if (demo.status === 'won' || demo.status === 'lost') {
              demo.stats.played += 1;
              demo.stats[demo.status] += 1;
            }
            return { status: demo.status, giver: demo.giver, result: cell.kind };
          }
          function newGame() {
            dealt = (dealt + 1) % boards.length;
            demo.words = cells(boards[dealt]);
            demo.status = 'clue_needed';
            demo.clue = null;
            demo.round = 0;
            demo.history = [];
            return { status: demo.status, giver: demo.giver };
          }
          return {
            page: { entry: 'board/index.html', typeName: 'Word Clues', params: {} },
            tools: {
              guess: guess,
              pass: function () {
                if (demo.status !== 'guessing') throw new Error('There is no guessing turn to end.');
                demo.status = 'clue_needed';
                return { status: demo.status, giver: demo.giver };
              },
              new_game: newGame,
              // The page's ask_clue tools read the board; Pim's reaction gives the clue.
              ask_clue_a: boardState,
              ask_clue_b: boardState,
              board: boardState,
              give_clue: giveClue,
            },
            data: { 'game.json': function () { return demo; } },
            chat: window.demoChat,
          };
        })());

        // ── one code path from here: window.gezel exists in every mode ──
        var demoMode = gezel.page.mode === 'demo';
        var game = null;
        var busy = false;

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        appSubscriptions.push(gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); }));
        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function el(id) { return document.getElementById(id); }
        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
          });
        }
        function notice(text) {
          el('notice').textContent = text;
          el('notice').hidden = !text;
        }

        function render() {
          var g = game || { status: 'new', words: [], stats: { played: 0, won: 0, lost: 0 } };
          var over = g.status === 'won' || g.status === 'lost';
          var clue = el('clue');
          if (g.status === 'new' || !g.words.length) {
            clue.innerHTML = '<span class="muted">Deal a board to start.</span>';
          } else if (g.status === 'guessing' && g.clue) {
            clue.innerHTML =
              '<span class="muted">' + esc(GIVERS[g.clue.giver] || 'Your clue-giver') + ' says</span><br />' +
              '<strong>' + esc(g.clue.word) + ', ' + g.clue.count + '</strong>' +
              ' <span class="muted">· ' + g.clue.guessesLeft + ' pick' + (g.clue.guessesLeft === 1 ? '' : 's') + ' left</span>';
          } else if (g.status === 'clue_needed') {
            clue.innerHTML = '<span class="muted">Waiting for the ' + esc(GIVERS[g.giver]) + '’s clue…</span>';
          } else {
            clue.innerHTML = g.status === 'won'
              ? '<strong>You found all six.</strong> <span class="muted">' + g.round + ' clue' + (g.round === 1 ? '' : 's') + '.</span>'
              : '<strong>The trap.</strong> <span class="muted">Better luck next game.</span>';
          }
          el('grid').innerHTML = g.words
            .map(function (w) {
              var shown = w.revealed || over;
              var cls = shown ? w.kind : '';
              if (over && !w.revealed && w.kind === 'target') cls = 'hidden-target';
              return (
                '<button type="button" class="cell ' + cls + '" data-word="' + esc(w.word) + '"' +
                (shown || g.status !== 'guessing' || busy ? ' disabled' : '') + '>' + esc(w.word) + '</button>'
              );
            })
            .join('');
          Array.prototype.forEach.call(el('grid').querySelectorAll('[data-word]'), function (b) {
            b.onclick = function () { play('guess', { word: b.getAttribute('data-word') }); };
          });
          el('pass').disabled = g.status !== 'guessing' || busy;
          // A clue-giver's turn can end without a clue; never leave the player stuck.
          el('ask-again').hidden = g.status !== 'clue_needed';
          el('ask-again').disabled = busy;
          el('new-game').disabled = busy;
          var s = g.stats || { played: 0, won: 0, lost: 0 };
          el('stats').textContent = s.played ? 'Games: ' + s.won + ' won, ' + s.lost + ' lost.' : '';
        }

        function askClue(giver) {
          return gezel.tools.invoke(giver === 'b' ? 'ask_clue_b' : 'ask_clue_a', {});
        }

        function play(tool, input) {
          if (busy) return;
          busy = true;
          notice('');
          render();
          gezel.tools
            .invoke(tool, input)
            .then(function (res) {
              var out = (res && res.output) || {};
              // A turn that ends, or a game that ends, goes to the clue-giver.
              if (out.status === 'clue_needed' || out.status === 'won' || out.status === 'lost')
                return askClue(out.giver || (game && game.giver));
            })
            .catch(function (err) {
              if (err && err.code === 'unavailable') notice('Playing happens in the app’s Output pane.');
              else notice((err && err.message) || 'That did not work. Try again.');
            })
            .then(function () {
              busy = false;
              return load();
            });
        }

        function load() {
          return gezel.data
            .read('game.json')
            .then(function (g) { game = g; render(); })
            .catch(function () { render(); });
        }

        el('pass').onclick = function () { play('pass', {}); };
        el('ask-again').onclick = function () {
          if (busy || !game) return;
          busy = true;
          notice('');
          render();
          askClue(game.giver)
            .catch(function (err) {
              notice(err && err.code === 'unavailable' ? 'Playing happens in the app’s Output pane.' : (err && err.message) || 'That did not work. Try again.');
            })
            .then(function () { busy = false; return load(); });
        };
        el('new-game').onclick = function () { play('new_game', {}); };
        load();
        appSubscriptions.push(gezel.data.watch('game.json', function () { load(); }));
      })();
    </script>
  <script src="application.js" defer></script>
  </body>
</html>
