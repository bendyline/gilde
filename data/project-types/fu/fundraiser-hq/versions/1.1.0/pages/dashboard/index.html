<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Fundraiser HQ</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2; --card: #fff; --ink: #2b2620; --muted: #7a7166;
        --accent: #b5651d; --track: #ece5da; --good: #4a7c59; --warn: #a4552e;
      }
      :root[data-theme='dark'] {
        --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
        --accent: #e0894a; --track: #3a352f; --good: #7fae8d; --warn: #d98a63;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
          --accent: #e0894a; --track: #3a352f; --good: #7fae8d; --warn: #d98a63;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 var(--font-body, system-ui, sans-serif); background: var(--bg); color: var(--ink); padding: 1.5rem 1.25rem; }
      main { max-width: 620px; margin: 0 auto; }
      h1 { font-family: var(--font-heading, Georgia, serif); font-size: 1.35rem; font-weight: 600; margin: 0 0 0.15rem; }
      .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.9rem; }
      .thermo { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 1rem; margin-bottom: 0.75rem; }
      .thermo .raised { font-size: 1.9rem; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
      .thermo .goal { color: var(--muted); font-size: 0.9rem; }
      .bar { background: var(--track); border-radius: 4px; height: 14px; overflow: hidden; margin-top: 0.6rem; }
      .bar > span { display: block; height: 100%; background: var(--good); border-radius: 4px; transition: width 0.4s ease; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
      .panel { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.85rem 1rem; font-size: 0.9rem; }
      .panel h2 { font-family: var(--font-ui, system-ui, sans-serif); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 0.5rem; }
      .panel ul { margin: 0; padding-left: 1.05rem; }
      .panel li { margin: 0.25rem 0; }
      .panel .amt { font-weight: 600; }
      .panel .who { color: var(--muted); }
      .panel .owed { list-style: none; padding-left: 0; }
      .panel .owed li.empty { margin-left: 0; }
      .owed li:not(.empty) { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.25rem 0.6rem; margin: 0.4rem 0; }
      .key { min-height: 30px; padding: 0.2rem 0.65rem; border: 1px solid var(--track); border-radius: 6px; background: var(--card); color: var(--ink); cursor: pointer; font: inherit; font-size: 0.82rem; }
      .key:hover { border-color: var(--muted); }
      .empty { color: var(--muted); font-style: italic; }
      .panel li.empty { color: var(--muted); list-style: none; margin-left: -1.05rem; }
      @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-banner strong { font-weight: 700; }
      .demo-reset {
        flex: none;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      .demo-reset:hover { border-color: var(--ink); }
    </style>
  <style>
 [hidden]{display:none!important}body{font-family:var(--font-body,system-ui,sans-serif);line-height:1.5}h1,h2,h3{font-family:var(--font-heading,Georgia,serif)}button,input,select,textarea{font-family:var(--font-ui,system-ui,sans-serif)}:focus-visible{outline:3px solid var(--accent,#a65334);outline-offset:3px}main{min-width:0}.app-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:24px 0;align-items:start}.app-search{margin:20px 0;max-width:540px}.app-problem{padding:12px;border:1px solid currentColor;border-radius:6px;overflow-wrap:anywhere}.app-section-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.app-section-nav a{padding:8px 12px;border:1px solid var(--border,#92816a);border-radius:6px;color:inherit;text-decoration:none;font-size:14px}.app-section-nav a:hover{background:color-mix(in srgb,currentColor 8%,transparent)}html[data-gezel-fullscreen=true] main>h1{font-size:clamp(28px,3vw,40px);margin-top:0}html[data-gezel-fullscreen=true] .board{min-width:0}main section{scroll-margin-top:16px}@media(max-width:620px){main{padding:16px!important}.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.board,.columns{max-width:100%;overflow-x:auto}h1{overflow-wrap:anywhere}button{min-height:40px}}</style>
    <style data-app-shell="2">
    /* Shared app furniture from the Gezel app UX guide. The page owns everything else. */
    :root{--app-action:var(--gezel-component-accent,#805128);--app-on-action:#fffaf3;--app-banner-bg:#f3eddf;--app-banner-line:#d6cbb8}
    :root[data-theme=dark]{--app-action:var(--gezel-component-accent,#e0b78b);--app-on-action:#1f1a16;--app-banner-bg:#25221f;--app-banner-line:#4a4238}
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--app-action:var(--gezel-component-accent,#e0b78b);--app-on-action:#1f1a16;--app-banner-bg:#25221f;--app-banner-line:#4a4238}}
    main h1{font-weight:400}
    html[data-gezel-fullscreen=true] main h1{font-size:clamp(28px,3vw,40px);margin-top:0}
    .app-tabs{margin:20px 0 24px}
    .app-actionbar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;margin:16px 0 24px}
    .app-panel>.app-actionbar:first-child{margin-top:0}
    .app-settings{display:grid;gap:16px;max-width:760px;margin:0 0 24px}
    .app-search{margin:0}
    .app-search gezel-collection-filter{margin:0 0 12px;max-width:540px}
    .app-primary{min-height:44px;padding:8px 16px;border:1px solid var(--app-action);border-radius:6px;background:var(--app-action);color:var(--app-on-action);font-weight:600}
    .app-primary:disabled{display:none}
    main li.empty{display:block;grid-column:1/-1}
    html[data-app-legacy] [data-app-action]{display:none!important}
    [data-gezel-demo-banner]:not([hidden]){display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 16px;padding:8px 8px 8px 14px;border:1px solid var(--app-banner-line);border-radius:10px;background:var(--app-banner-bg);color:inherit;font-size:14px;line-height:1.4}
    [data-gezel-demo-banner] button{min-height:32px;padding:4px 12px;border:1px solid var(--app-banner-line);border-radius:6px;background:transparent;color:inherit;font-size:13px}
    @media(max-width:620px){.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}:is(.tiles,.stats,.summary):has(>:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))!important}:is(.tiles,.stats,.summary):has(>:only-child){grid-template-columns:minmax(0,1fr)!important}}
    </style>
  <script>
var appDisposed=false,appLoadRevision=0,appSubscriptions=[];
function reportAppError(error){var output=document.getElementById('app-load-error');if(output){output.hidden=!error;output.textContent=error?'Could not refresh this view. '+(error.message||'Try again.'):'';}}
window.addEventListener('pagehide',function(){appDisposed=true;appLoadRevision++;appSubscriptions.forEach(function(stop){stop();});},{once:true});
</script></head>
  <body>
    <main>
<p class="app-problem" id="app-load-error" role="status" hidden></p>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong>: a sample drive for a neighborhood reading garden. Changes stay in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1 id="title">Fundraiser HQ</h1>
      <p class="sub" id="sub">Loading the drive…</p>
      <div class="thermo">
        <div class="raised" id="raised">—</div>
        <div class="goal" id="goal"></div>
        <div class="bar"><span id="bar" style="width: 0%"></span></div>
      </div>
      <div class="cols">
        <div class="panel" id="gifts-panel">
          <h2>Donations</h2>
          <ul id="gifts"><li class="empty">No gifts yet — the first one starts the story.</li></ul>
        </div>
        <div class="panel" id="owed-panel">
          <h2>Thank-yous owed</h2>
          <ul class="owed" id="owed"><li class="empty">All caught up.</li></ul>
        </div>
      </div>
    </main>
    <script src="demo-chat.js"></script>
    <script>
      (function () {
        'use strict';

        // ── demo drive (used only when the page opens as a raw file) ──
        var demoDonations = {
          currency: 'USD',
          cause: 'The neighborhood reading garden',
          goalCents: 1000000,
          entries: [
            { id: 'ledger-1', kind: 'in', category: 'donation', amountCents: 12500, data: { donor: 'Mara', thanked: true } },
            { id: 'ledger-2', kind: 'in', category: 'donation', amountCents: 50000, data: { donor: 'Canal Street Books', thanked: true } },
            { id: 'ledger-3', kind: 'in', category: 'donation', amountCents: 7500, data: { donor: 'Anonymous', thanked: false } },
            { id: 'ledger-4', kind: 'in', category: 'donation', amountCents: 25000, data: { donor: 'The De Vries family', thanked: false } },
            { id: 'ledger-5', kind: 'in', category: 'donation', amountCents: 100000, data: { donor: 'Veld Works', thanked: true } },
          ],
        };
        // The demo answers the way drive-store does: same ids, same matching, same totals.
        function demoDrive(listing) {
          var raised = 0, unthanked = 0;
          demoDonations.entries.forEach(function (e) { raised += e.amountCents; if (!e.data || e.data.thanked !== true) unthanked++; });
          var pct = Math.min(100, Math.round((raised / demoDonations.goalCents) * 100));
          return { raisedCents: raised, donors: demoDonations.entries.length, unthanked: unthanked,
            summary: listing || 'Raised ' + (raised / 100).toFixed(2) + ' of ' + (demoDonations.goalCents / 100).toFixed(2) + ' (' + pct + ' percent) across ' + demoDonations.entries.length + ' gift(s). ' + (unthanked ? unthanked + ' thank-you(s) still owed.' : 'Everyone thanked.') };
        }

        window.gezel || window.makeDemoGezel({
          page: { entry: 'dashboard/index.html', typeName: 'Fundraiser HQ', params: { cause: demoDonations.cause, goalCents: demoDonations.goalCents } },
          tools: {
"page_record_donation": function(input) { if(!(input.amount>0))throw new Error("record_donation needs a positive 'amount' (ordinary units)."); var e={id:'ledger-'+(demoDonations.entries.length+1),kind:'in',category:'donation',amountCents:Math.round(input.amount*100),data:{donor:input.donor||'anonymous',thanked:false}}; if(input.note)e.note=input.note; demoDonations.entries.push(e); return demoDrive(); },
"page_mark_thanked": function(input) { if(!input.id&&!input.donor)throw new Error("Pass 'id' (e.g. 'ledger-4') or a unique 'donor'."); var matches=demoDonations.entries.filter(function(e){return input.id?e.id===input.id:String(e.data&&e.data.donor||'').toLowerCase()===String(input.donor).toLowerCase()&&!(e.data&&e.data.thanked===true);}); if(!matches.length)throw new Error('No matching unthanked donation found.'); if(matches.length>1&&!input.id)throw new Error("Multiple unthanked gifts from '"+input.donor+"': "+matches.map(function(m){return m.id;}).join(', ')+'. Pass id.'); matches[0].data=Object.assign({},matches[0].data,{thanked:true}); return demoDrive(); },
"drive_status": function() { return demoDrive(); },
"donor_list": function() { return demoDrive(demoDonations.entries.map(function(e){return e.id+' '+(e.amountCents/100).toFixed(2)+' from '+(e.data&&e.data.donor||'anonymous')+(e.data&&e.data.thanked===true?'':' (thank-you owed)');}).join('\n')||'No gifts yet.'); }
},
data: {
            'donations.json': function () { return demoDonations; },
          },
          chat: window.demoChat,
        });

        // ── one code path from here: window.gezel exists in every mode ──
        var demoMode = gezel.page.mode === 'demo';

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        appSubscriptions.push(gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); }));

        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        // Money in the drive's currency when it names one; whole amounts drop the cents.
        var currency = '';
        function fmt(cents) {
          var opts = { minimumFractionDigits: cents % 100 ? 2 : 0, maximumFractionDigits: 2 };
          if (/^[A-Z]{3}$/.test(currency)) {
            try { return (cents / 100).toLocaleString(undefined, Object.assign({ style: 'currency', currency: currency }, opts)); } catch (e) { /* unknown code: plain number */ }
          }
          return (cents / 100).toLocaleString(undefined, opts);
        }

        function el(tag, text, cls) { var e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }

        function render(doc) {
          var entries = Array.isArray(doc.entries) ? doc.entries : [];
          currency = String(doc.currency || '');
          var goal = Number(doc.goalCents);
          if (!isFinite(goal) || goal <= 0) goal = 0;
          var raised = 0;
          entries.forEach(function (e) { raised += e.amountCents; });
          if (doc.cause) document.getElementById('title').textContent = 'Fundraiser: ' + doc.cause;
          var owed = entries.filter(function (e) { return !e.data || e.data.thanked !== true; });
          document.getElementById('sub').textContent = entries.length
            ? entries.length + (entries.length === 1 ? ' gift' : ' gifts') + ' so far. ' + (owed.length ? owed.length + (owed.length === 1 ? ' thank-you is' : ' thank-yous are') + ' still owed.' : 'Everyone has been thanked.')
            : 'No gifts yet';
          document.getElementById('raised').textContent = fmt(raised);
          document.getElementById('goal').textContent = goal > 0 ? 'of ' + fmt(goal) + ' — ' + Math.min(100, Math.round((raised / goal) * 100)) + ' percent there' : '';
          document.getElementById('bar').style.width = (goal > 0 ? Math.min(100, Math.round((raised / goal) * 100)) : raised > 0 ? 100 : 0) + '%';

          var recent = entries.slice().reverse();
          var gifts = document.getElementById('gifts');
          if (recent.length) {
            gifts.replaceChildren();
            recent.forEach(function (e) {
              var li = el('li');
              li.append(el('span', fmt(e.amountCents), 'amt'), document.createTextNode(' '), el('span', 'from ' + ((e.data && e.data.donor) || 'anonymous'), 'who'));
              gifts.append(li);
            });
          }
          var list = document.getElementById('owed');
          list.replaceChildren();
          if (!owed.length) list.append(el('li', 'All caught up.', 'empty'));
          owed.forEach(function (e) {
            var who = (e.data && e.data.donor) || 'anonymous', li = el('li'), key = el('button', 'Mark thanked', 'key');
            // The key opens Mark a donor thanked with this gift chosen (the app shell wires data-app-action).
            key.type = 'button';
            key.setAttribute('aria-label', 'Mark ' + who + ' thanked for ' + fmt(e.amountCents));
            key.setAttribute('data-app-action', 'mark_thanked');
            key.setAttribute('data-app-values', JSON.stringify({ id: e.id }));
            li.append(el('span', who + ' (' + fmt(e.amountCents) + ')'), key);
            list.append(li);
          });
        }

        window.addEventListener('gezel-app-data-changed', function(){ loadDrive(); });
        function loadDrive(){
var revision=++appLoadRevision;
return Promise.all([gezel.data.read('donations.json')]).then(function(values){if(appDisposed||revision!==appLoadRevision)return;reportAppError(null);render(values[0]||{});}).catch(function(error){if(!appDisposed&&revision===appLoadRevision)reportAppError(error);});
}

        loadDrive();
        appSubscriptions.push(gezel.data.watch('donations.json', function () { loadDrive(); }));
      })();
    </script>
  <script src="application.js" defer></script>
  </body>
</html>
