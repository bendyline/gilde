<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Language practice</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2;
        --card: #fff;
        --ink: #2b2620;
        --muted: #7a7166;
        --accent: #b5651d;
        --track: #ece5da;
        --good: #4a7c59;
        --warn: #a4552e;
      }
      :root[data-theme='dark'] {
        --bg: #1c1a17;
        --card: #262320;
        --ink: #efe9e0;
        --muted: #a59a8c;
        --accent: #e0894a;
        --track: #3a352f;
        --good: #7fae8d;
        --warn: #d98a63;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1a17;
          --card: #262320;
          --ink: #efe9e0;
          --muted: #a59a8c;
          --accent: #e0894a;
          --track: #3a352f;
          --good: #7fae8d;
          --warn: #d98a63;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 1.25rem 1rem;
      }
      main { max-width: 600px; margin: 0 auto; }
      h1 {
        font-family: Georgia, 'PT Serif', 'Times New Roman', serif;
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0 0 0.15rem;
      }
      h2 { font-size: 0.95rem; margin: 1.25rem 0 0.5rem; }
      .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1rem; }
      .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }
      .tile {
        background: var(--card);
        border: 1px solid var(--track);
        border-radius: 10px;
        padding: 0.65rem 0.4rem;
        text-align: center;
      }
      .tile .n { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
      .tile .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .panel {
        background: var(--card);
        border: 1px solid var(--track);
        border-radius: 10px;
        padding: 0.85rem 1rem;
      }
      .panel p { margin: 0.2rem 0; }
      .muted { color: var(--muted); }
      .scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.5rem; }
      button {
        font: inherit;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--track);
        border-radius: 6px;
        min-height: 44px;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
        text-align: left;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      .scene-btn .t { display: block; font-weight: 600; }
      .scene-btn .r { display: block; font-size: 0.8rem; color: var(--muted); }
      .actions { display: flex; gap: 0.5rem; margin-top: 0.65rem; flex-wrap: wrap; }
      .actions button { text-align: center; }
      button.got { border-color: var(--good); color: var(--good); }
      button.miss { border-color: var(--warn); color: var(--warn); }
      .card-face { font-size: 1.1rem; margin: 0.25rem 0; overflow-wrap: anywhere; }
      .card-face s { color: var(--warn); }
      .right { color: var(--good); font-weight: 600; }
      ul.history { margin: 0; padding-left: 1.1rem; color: var(--muted); }
      ul.history li { margin: 0.15rem 0; }
      .banner {
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 0.45rem 0.7rem;
        font-size: 0.85rem;
        margin-bottom: 0.75rem;
      }
      .banner[hidden] { display: none; }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-reset { flex: none; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong>: sample data stays in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1 id="title">Your language practice</h1>
      <p class="sub" id="sub">Loading your progress…</p>
      <p class="banner" id="notice" hidden></p>
      <div class="tiles">
        <div class="tile"><div class="n" id="level">-</div><div class="l">Level</div></div>
        <div class="tile"><div class="n" id="streak">-</div><div class="l">Day streak</div></div>
        <div class="tile"><div class="n" id="due">-</div><div class="l">Reviews due</div></div>
      </div>

      <section id="scene-section" hidden>
        <h2>Scene in play</h2>
        <div class="panel">
          <p><strong id="scene-title"></strong></p>
          <p class="muted" id="scene-detail"></p>
          <p id="scene-goal"></p>
          <p class="muted">Answer your tutor in the chat. Corrections appear under each reply.</p>
          <div class="actions"><button type="button" id="end-scene">End scene</button></div>
        </div>
      </section>

      <section id="review-section">
        <h2>Review</h2>
        <div class="panel" id="review"></div>
      </section>

      <section>
        <h2>Scenes</h2>
        <div class="scenes" id="scenes"></div>
      </section>

      <section id="history-section" hidden>
        <h2>Recent scenes</h2>
        <ul class="history" id="history"></ul>
      </section>
    </main>
    <script>
/* gezel-page-demo-stub v1 */
/*
 * The canonical demo stub for Gezel type pages. MIT License.
 *
 * Paste this file's bytes verbatim into a <script> block ahead of the
 * page's own code, then call makeDemoGezel({ page, tools, data }) with the
 * page's demo handlers. Served by Gezel, the real window.gezel is already
 * injected and the stub steps aside; opened as a raw file (the live demos
 * on gezelgilde.com), it installs a window.gezel whose tools and data are
 * the page-supplied handler maps — one code path in every mode. `tools`
 * and `data` map a tool name / declared read path to a function; data
 * handlers back read() and list(), and url() returns the handler's value
 * or passes a data: URI through. See docs/page-authoring.md.
 */
(function () {
  'use strict';
  window.makeDemoGezel = function (opts) {
    if (window.gezel) return window.gezel;
    var page = (opts && opts.page) || {};
    var tools = (opts && opts.tools) || {};
    var data = (opts && opts.data) || {};
    var themeListeners = [];
    var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var ui = {
      theme: { mode: media && media.matches ? 'dark' : 'light' },
      onTheme: function (cb) {
        themeListeners.push(cb);
        return function () {
          var at = themeListeners.indexOf(cb);
          if (at >= 0) themeListeners.splice(at, 1);
        };
      },
    };
    if (media && media.addEventListener) {
      media.addEventListener('change', function (ev) {
        ui.theme = { mode: ev.matches ? 'dark' : 'light' };
        themeListeners.slice().forEach(function (cb) { cb(ui.theme); });
      });
    }
    function fail(code, message) {
      var err = new Error(message);
      err.code = code;
      return Promise.reject(err);
    }
    function run(map, key, arg) {
      if (!Object.prototype.hasOwnProperty.call(map, key)) return null;
      return Promise.resolve().then(function () { return map[key](arg); });
    }
    window.gezel = {
      page: {
        api: 1,
        projectId: 'demo',
        source: 'type',
        entry: page.entry || 'index.html',
        typeName: page.typeName || 'demo',
        params: page.params || {},
        mode: 'demo',
      },
      tools: {
        list: function () { return Promise.resolve(Object.keys(tools)); },
        invoke: function (name, input) {
          var call = run(tools, name, input || {});
          if (!call) return fail('not-allowed', "The demo does not handle the tool '" + name + "'.");
          return call.then(function (output) { return { output: output }; });
        },
      },
      data: {
        read: function (path, o) {
          return run(data, path, o || {}) || fail('not-allowed', "The demo has no data for '" + path + "'.");
        },
        list: function (path, o) {
          return run(data, path, o || {}) || Promise.resolve([]);
        },
        watch: function () { return function () {}; },
        url: function (path) {
          if (Object.prototype.hasOwnProperty.call(data, path)) return String(data[path]({}));
          return typeof path === 'string' && path.indexOf('data:') === 0 ? path : '';
        },
      },
      ui: ui,
      refresh: function () {},
    };
    return window.gezel;
  };
})();
    </script>
    <script>
      // Reads progress.json, scenarios.json and reviews.json (pages.reads) and
      // acts through the page tools start_scene, review_card and end_scene.
      (function () {
        'use strict';

        // ── demo data (used only when the page opens as a raw file) ──
        var DAY = 24 * 60 * 60 * 1000;
        var demoNow = Date.now();
        var demo = {
          progress: {
            language: 'Spanish',
            level: 2,
            sessions: 6,
            streak: 4,
            lastPracticeDay: null,
            scene: null,
            history: [
              { day: '2026-10-03', scene: 'Ordering at a café', turns: 6, mistakes: 2 },
              { day: '2026-10-05', scene: 'At the market', turns: 8, mistakes: 3 },
              { day: '2026-10-06', scene: 'At the pharmacy', turns: 7, mistakes: 1 },
            ],
            notes: [],
          },
          scenarios: [
            { id: 'coffee', title: 'Ordering at a café', level: 1, role: 'barista', setting: 'A busy café.', goal: 'Order a drink and ask the price.' },
            { id: 'market', title: 'At the market', level: 1, role: 'fruit seller', setting: 'A market stall.', goal: 'Buy three kinds of fruit.' },
            { id: 'pharmacy', title: 'At the pharmacy', level: 2, role: 'pharmacist', setting: 'A small pharmacy.', goal: 'Ask what to take for a sore throat.' },
            { id: 'luggage', title: 'Lost luggage', level: 2, role: 'airline agent', setting: 'The baggage desk.', goal: 'Report a missing suitcase.' },
            { id: 'doctor', title: "At the doctor's", level: 3, role: 'doctor', setting: "A doctor's office.", goal: 'Explain an ankle injury.' },
          ],
          reviews: [
            { id: 'r-1', wrong: 'una café', right: 'un café', note: 'café is masculine', box: 1, lastSeenAt: new Date(demoNow - 2 * DAY).toISOString() },
            { id: 'r-2', wrong: 'soy cansado', right: 'estoy cansado', note: 'states use estar', box: 2, lastSeenAt: new Date(demoNow - 4 * DAY).toISOString() },
            { id: 'r-3', wrong: 'me gusta las uvas', right: 'me gustan las uvas', note: '', box: 3, lastSeenAt: new Date(demoNow - DAY).toISOString() },
          ],
        };

        function demoScene(id) {
          var s = demo.scenarios.find(function (x) { return x.id === id; });
          demo.progress.scene = { id: s.id, title: s.title, role: s.role, setting: s.setting, goal: s.goal, level: demo.progress.level, status: 'active', turns: 0, mistakes: 0 };
          return { status: 'started' };
        }

        makeDemoGezel({
          page: { entry: 'dashboard/index.html', typeName: 'Language Trainer', params: { language: 'Spanish' } },
          tools: {
            start_scene: function (input) { return demoScene(input.scenario); },
            end_scene: function () {
              if (demo.progress.scene) demo.progress.scene.status = 'done';
              return { status: 'done' };
            },
            review_card: function (input) {
              var card = demo.reviews.find(function (c) { return c.id === input.id; });
              if (card) {
                card.box = input.verdict === 'got-it' ? Math.min(3, card.box + 1) : 1;
                card.lastSeenAt = new Date().toISOString();
              }
              return { status: 'idle' };
            },
          },
          data: {
            'progress.json': function () { return demo.progress; },
            'scenarios.json': function () { return { scenarios: demo.scenarios }; },
            'reviews.json': function () { return { items: demo.reviews }; },
          },
        });

        // ── one code path from here: window.gezel exists in every mode ──
        var INTERVAL = { 1: 1, 2: 3, 3: 7 };
        var state = { progress: null, scenarios: [], reviews: [], revealed: false };

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); });
        var demoMode = gezel.page.mode === 'demo';
        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function el(id) { return document.getElementById(id); }
        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
          });
        }
        function dueAt(card) {
          return card.lastSeenAt ? Date.parse(card.lastSeenAt) + (INTERVAL[card.box] || 1) * DAY : 0;
        }
        function dueCards() {
          var now = Date.now();
          return state.reviews
            .filter(function (c) { return dueAt(c) <= now; })
            .sort(function (a, b) { return a.box - b.box || dueAt(a) - dueAt(b); });
        }
        function notice(text) {
          el('notice').textContent = text;
          el('notice').hidden = !text;
        }

        function act(tool, input) {
          notice('');
          return gezel.tools
            .invoke(tool, input)
            .then(function () { return load(); })
            .catch(function (err) {
              if (err && err.code === 'unavailable') notice('Scenes and reviews run in the app’s Output pane.');
              else notice((err && err.message) || 'That did not work. Try again.');
            });
        }

        function renderScene() {
          var scene = state.progress && state.progress.scene;
          var active = !!(scene && scene.status === 'active');
          el('scene-section').hidden = !active;
          if (!active) return;
          el('scene-title').textContent = scene.title;
          el('scene-detail').textContent = 'Your tutor plays the ' + scene.role + '. ' + (scene.setting || '');
          el('scene-goal').textContent = 'Your goal: ' + scene.goal;
        }

        function renderReview() {
          var due = dueCards();
          el('due').textContent = due.length;
          var box = el('review');
          if (!due.length) {
            var next = state.reviews.map(dueAt).filter(function (t) { return t > Date.now(); }).sort()[0];
            box.innerHTML = state.reviews.length
              ? '<p class="muted">Nothing due. ' + (next ? 'Next review ' + esc(new Date(next).toLocaleDateString()) + '.' : '') + '</p>'
              : '<p class="muted">No corrections yet. Mistakes from your scenes land here to practice.</p>';
            return;
          }
          var card = due[0];
          box.innerHTML =
            '<p class="muted">How do you say it correctly?</p>' +
            '<p class="card-face"><s>' + esc(card.wrong) + '</s></p>' +
            (state.revealed
              ? '<p class="card-face right">' + esc(card.right) + '</p>' + (card.note ? '<p class="muted">' + esc(card.note) + '</p>' : '') +
                '<div class="actions"><button type="button" class="got" data-verdict="got-it">Got it</button>' +
                '<button type="button" class="miss" data-verdict="missed">Missed</button></div>'
              : '<div class="actions"><button type="button" id="reveal">Show the answer</button></div>');
          var reveal = el('reveal');
          if (reveal) reveal.onclick = function () { state.revealed = true; renderReview(); };
          Array.prototype.forEach.call(box.querySelectorAll('[data-verdict]'), function (b) {
            b.onclick = function () {
              state.revealed = false;
              act('review_card', { id: card.id, verdict: b.getAttribute('data-verdict') });
            };
          });
        }

        function renderScenes() {
          var level = (state.progress && state.progress.level) || 1;
          var inPlay = !!(state.progress && state.progress.scene && state.progress.scene.status === 'active');
          el('scenes').innerHTML = state.scenarios
            .map(function (s) {
              var locked = s.level > level;
              return (
                '<button type="button" class="scene-btn" data-scene="' + esc(s.id) + '"' + (locked || inPlay ? ' disabled' : '') + '>' +
                '<span class="t">' + esc(s.title) + '</span>' +
                '<span class="r">' + (locked ? 'Level ' + s.level : 'You talk to the ' + esc(s.role)) + '</span></button>'
              );
            })
            .join('');
          Array.prototype.forEach.call(el('scenes').querySelectorAll('[data-scene]'), function (b) {
            b.onclick = function () { act('start_scene', { scenario: b.getAttribute('data-scene') }); };
          });
        }

        function renderHistory() {
          var history = (state.progress && state.progress.history) || [];
          el('history-section').hidden = !history.length;
          el('history').innerHTML = history
            .slice(-5)
            .reverse()
            .map(function (h) {
              return '<li>' + esc(h.scene) + ': ' + h.turns + ' turns, ' + h.mistakes + ' correction' + (h.mistakes === 1 ? '' : 's') + '</li>';
            })
            .join('');
        }

        function render() {
          var p = state.progress || {};
          el('title').textContent = 'Your ' + (p.language || 'language') + ' practice';
          el('sub').textContent = (p.sessions || 0) + ' scene' + (p.sessions === 1 ? '' : 's') + ' played. Pick one below, or answer your tutor in the chat.';
          el('level').textContent = p.level || 1;
          el('streak').textContent = p.streak || 0;
          renderScene();
          renderReview();
          renderScenes();
          renderHistory();
        }

        function load() {
          return Promise.all([
            gezel.data.read('progress.json').catch(function () { return null; }),
            gezel.data.read('scenarios.json').catch(function () { return null; }),
            gezel.data.read('reviews.json').catch(function () { return null; }),
          ]).then(function (r) {
            state.progress = r[0] || { level: 1, sessions: 0, streak: 0 };
            state.scenarios = (r[1] && r[1].scenarios) || [];
            state.reviews = (r[2] && r[2].items) || [];
            render();
          });
        }

        el('end-scene').onclick = function () { act('end_scene', {}); };
        load();
        gezel.data.watch('progress.json', function () { load(); });
        gezel.data.watch('reviews.json', function () { load(); });
      })();
    </script>
  </body>
</html>
