<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Language progress</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2;
        --card: #fff;
        --ink: #2b2620;
        --muted: #7a7166;
        --accent: #b5651d;
        --track: #ece5da;
      }
      :root[data-theme='dark'] {
        --bg: #1c1a17;
        --card: #262320;
        --ink: #efe9e0;
        --muted: #a59a8c;
        --accent: #e0894a;
        --track: #3a352f;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1a17;
          --card: #262320;
          --ink: #efe9e0;
          --muted: #a59a8c;
          --accent: #e0894a;
          --track: #3a352f;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 2rem 1.25rem;
      }
      main { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
      .sub { color: var(--muted); margin: 0 0 1.5rem; }
      .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
      .tile {
        background: var(--card);
        border: 1px solid var(--track);
        border-radius: 12px;
        padding: 1rem;
        text-align: center;
      }
      .tile .n { font-size: 2rem; font-weight: 700; color: var(--accent); }
      .tile .l { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .bar { background: var(--track); border-radius: 999px; height: 10px; overflow: hidden; margin: 0.5rem 0 1.5rem; }
      .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }
      .notes { background: var(--card); border: 1px solid var(--track); border-radius: 12px; padding: 1rem 1.25rem; }
      .notes h2 { font-size: 0.95rem; margin: 0 0 0.5rem; }
      .notes ul { margin: 0; padding-left: 1.1rem; color: var(--muted); }
      .notes li { margin: 0.2rem 0; }
      .empty { color: var(--muted); font-style: italic; }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-banner strong { font-weight: 700; }
      .demo-reset {
        flex: none;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      .demo-reset:hover { border-color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong> — sample data stays in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1 id="title">Your language journey</h1>
      <p class="sub" id="sub">Loading your progress…</p>
      <div class="tiles">
        <div class="tile"><div class="n" id="level">—</div><div class="l">Level</div></div>
        <div class="tile"><div class="n" id="sessions">—</div><div class="l">Sessions</div></div>
        <div class="tile"><div class="n" id="streak">—</div><div class="l">Day streak</div></div>
      </div>
      <div class="bar"><span id="levelbar" style="width: 0%"></span></div>
      <div class="notes">
        <h2>Recent notes</h2>
        <ul id="notes"><li class="empty">No notes yet — start a conversation with your tutor.</li></ul>
      </div>
    </main>
    <script>
/* gezel-page-demo-stub v1 */
/*
 * The canonical demo stub for Gezel type pages. MIT License.
 *
 * Paste this file's bytes verbatim into a <script> block ahead of the
 * page's own code, then call makeDemoGezel({ page, tools, data }) with the
 * page's demo handlers. Served by Gezel, the real window.gezel is already
 * injected and the stub steps aside; opened as a raw file (the live demos
 * on gezelgilde.com), it installs a window.gezel whose tools and data are
 * the page-supplied handler maps — one code path in every mode. `tools`
 * and `data` map a tool name / declared read path to a function; data
 * handlers back read() and list(), and url() returns the handler's value
 * or passes a data: URI through. See docs/page-authoring.md.
 */
(function () {
  'use strict';
  window.makeDemoGezel = function (opts) {
    if (window.gezel) return window.gezel;
    var page = (opts && opts.page) || {};
    var tools = (opts && opts.tools) || {};
    var data = (opts && opts.data) || {};
    var themeListeners = [];
    var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var ui = {
      theme: { mode: media && media.matches ? 'dark' : 'light' },
      onTheme: function (cb) {
        themeListeners.push(cb);
        return function () {
          var at = themeListeners.indexOf(cb);
          if (at >= 0) themeListeners.splice(at, 1);
        };
      },
    };
    if (media && media.addEventListener) {
      media.addEventListener('change', function (ev) {
        ui.theme = { mode: ev.matches ? 'dark' : 'light' };
        themeListeners.slice().forEach(function (cb) { cb(ui.theme); });
      });
    }
    function fail(code, message) {
      var err = new Error(message);
      err.code = code;
      return Promise.reject(err);
    }
    function run(map, key, arg) {
      if (!Object.prototype.hasOwnProperty.call(map, key)) return null;
      return Promise.resolve().then(function () { return map[key](arg); });
    }
    window.gezel = {
      page: {
        api: 1,
        projectId: 'demo',
        source: 'type',
        entry: page.entry || 'index.html',
        typeName: page.typeName || 'demo',
        params: page.params || {},
        mode: 'demo',
      },
      tools: {
        list: function () { return Promise.resolve(Object.keys(tools)); },
        invoke: function (name, input) {
          var call = run(tools, name, input || {});
          if (!call) return fail('not-allowed', "The demo does not handle the tool '" + name + "'.");
          return call.then(function (output) { return { output: output }; });
        },
      },
      data: {
        read: function (path, o) {
          return run(data, path, o || {}) || fail('not-allowed', "The demo has no data for '" + path + "'.");
        },
        list: function (path, o) {
          return run(data, path, o || {}) || Promise.resolve([]);
        },
        watch: function () { return function () {}; },
        url: function (path) {
          if (Object.prototype.hasOwnProperty.call(data, path)) return String(data[path]({}));
          return typeof path === 'string' && path.indexOf('data:') === 0 ? path : '';
        },
      },
      ui: ui,
      refresh: function () {},
    };
    return window.gezel;
  };
})();
    </script>
    <script>
      // Reads the student's progress through window.gezel (progress.json is
      // declared in the manifest's pages.reads).
      (function () {
        'use strict';

        // ── demo progress (used only when the page opens as a raw file) ──
        var demoProgress = {
          language: 'Dutch',
          level: 7,
          sessions: 18,
          streak: 5,
          notes: [
            'Word order is settling in after omdat clauses.',
            'Practice separable verbs in everyday errands.',
            'Listening: caught the main idea without subtitles.',
            'Next session: ordering at a café.',
          ],
        };

        makeDemoGezel({
          page: { entry: 'dashboard/index.html', typeName: 'Language Trainer', params: { language: 'Spanish' } },
          data: {
            'progress.json': function () { return demoProgress; },
          },
        });

        // ── one code path from here: window.gezel exists in every mode ──
        var demoMode = gezel.page.mode === 'demo';

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); });

        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
        function render(p) {
          document.getElementById('sub').textContent = 'Learning ' + (p.language || 'a new language');
          document.getElementById('level').textContent = p.level ?? 1;
          document.getElementById('sessions').textContent = p.sessions ?? 0;
          document.getElementById('streak').textContent = p.streak ?? 0;
          var lvl = Math.max(1, p.level ?? 1);
          document.getElementById('levelbar').style.width = Math.min(100, ((lvl - 1) % 10) * 10 + 5) + '%';
          var notes = Array.isArray(p.notes) ? p.notes.slice(-6).reverse() : [];
          var ul = document.getElementById('notes');
          if (notes.length) {
            ul.innerHTML = notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('');
          }
        }

        function loadProgress() {
          return gezel.data
            .read('progress.json')
            .then(function (p) {
              if (!p) throw new Error('no progress yet');
              render(p);
            })
            .catch(function () {
              document.getElementById('sub').textContent = 'No sessions recorded yet — say hello to your tutor to begin.';
            });
        }

        loadProgress();
        gezel.data.watch('progress.json', function () { loadProgress(); });
      })();
    </script>
  </body>
</html>
