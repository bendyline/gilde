<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Freelance office</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2; --card: #fff; --ink: #2b2620; --muted: #7a7166;
        --accent: #b5651d; --track: #ece5da; --good: #4a7c59; --warn: #a4552e;
      }
      :root[data-theme='dark'] {
        --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
        --accent: #e0894a; --track: #3a352f; --good: #7fae8d; --warn: #d98a63;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
          --accent: #e0894a; --track: #3a352f; --good: #7fae8d; --warn: #d98a63;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 var(--font-body, system-ui, sans-serif); background: var(--bg); color: var(--ink); padding: 1.5rem 1.25rem; }
      main { max-width: 820px; margin: 0 auto; }
      h1 { font-family: var(--font-heading, Georgia, serif); font-size: 1.35rem; font-weight: 600; margin: 0 0 0.15rem; }
      .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1rem; }
      .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1rem; }
      .tile { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.7rem 0.85rem; }
      .tile .n { font-size: 1.35rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
      .tile .n.warn { color: var(--warn); }
      .tile .n.good { color: var(--good); }
      .tile .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
      .col { min-width: 0; }
      .col-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 0.4rem; font-size: 0.72rem; }
      .col-head h2 { font-size: inherit; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0; font-weight: 600; }
      .col-head .count { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
      .card { background: var(--card); border: 1px solid var(--track); border-radius: 6px; padding: 0.5rem 0.6rem; margin-bottom: 0.45rem; font-size: 0.85rem; }
      .card .co { font-weight: 600; overflow-wrap: anywhere; }
      .card .amt { color: var(--muted); font-variant-numeric: tabular-nums; }
      .card .note { color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; margin-top: 0.1rem; }
      .chip { display: inline-block; border: 1px solid var(--warn); color: var(--warn); border-radius: 4px; padding: 0 0.3rem; font-size: 0.7rem; line-height: 1.4; margin-left: 0.3rem; }
      .empty { color: var(--muted); font-style: italic; background: var(--card); border: 1px dashed var(--track); border-radius: 10px; padding: 0.85rem 1.25rem; text-align: center; margin-bottom: 0.75rem; }
      @media (max-width: 640px) { .board, .tiles { grid-template-columns: 1fr; } }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-banner strong { font-weight: 700; }
      .demo-reset {
        flex: none;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      .demo-reset:hover { border-color: var(--ink); }
    </style>
  <style>
 [hidden]{display:none!important}body{font-family:var(--font-body,system-ui,sans-serif);line-height:1.5}h1,h2,h3{font-family:var(--font-heading,Georgia,serif)}button,input,select,textarea{font-family:var(--font-ui,system-ui,sans-serif)}:focus-visible{outline:3px solid var(--accent,#a65334);outline-offset:3px}main{min-width:0}.app-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:24px 0;align-items:start}.app-search{margin:20px 0;max-width:540px}.app-problem{padding:12px;border:1px solid currentColor;border-radius:6px;overflow-wrap:anywhere}.app-section-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.app-section-nav a{padding:8px 12px;border:1px solid var(--border,#92816a);border-radius:6px;color:inherit;text-decoration:none;font-size:14px}.app-section-nav a:hover{background:color-mix(in srgb,currentColor 8%,transparent)}html[data-gezel-fullscreen=true] main>h1{font-size:clamp(28px,3vw,40px);margin-top:0}html[data-gezel-fullscreen=true] .board{min-width:0}main section{scroll-margin-top:16px}@media(max-width:620px){main{padding:16px!important}.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.board,.columns{max-width:100%;overflow-x:auto}h1{overflow-wrap:anywhere}button{min-height:40px}}</style>
  <script>
var appDisposed=false,appLoadRevision=0,appSubscriptions=[];
function reportAppError(error){var output=document.getElementById('app-load-error');if(output){output.hidden=!error;output.textContent=error?'Could not refresh this view. '+(error.message||'Try again.'):'';}}
window.addEventListener('pagehide',function(){appDisposed=true;appLoadRevision++;appSubscriptions.forEach(function(stop){stop();});},{once:true});
</script></head>
  <body>
    <main>
<p class="app-problem" id="app-load-error" role="status" hidden></p>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong> — sample data stays in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1>Freelance office</h1>
      <p class="sub" id="sub">Loading the invoice book…</p>
      <div class="tiles">
        <div class="tile"><div class="n" id="t-out">—</div><div class="l">Outstanding</div></div>
        <div class="tile"><div class="n warn" id="t-over">—</div><div class="l">Overdue</div></div>
        <div class="tile"><div class="n good" id="t-paid">—</div><div class="l">Paid this month</div></div>
      </div>
      <div class="empty" id="empty" hidden>No invoices yet — tell your office administrator when you bill something.</div>
      <div class="board" id="board"></div>
    </main>
    <script src="demo-chat.js"></script>
    <script>
      (function () {
        'use strict';
        var STAGES = ['draft', 'sent', 'paid'];

        // ── demo invoice book (used only when the page opens as a raw file) ──
        // Dated back from today: one invoice four days overdue, one paid this
        // month and one last month, so every tile has something true to show.
        var DEMO_DAY = 86400000;
        function demoDate(days) { return new Date(Date.now() + days * DEMO_DAY).toISOString(); }
        var demoThisMonth = demoDate(-Math.min(3, new Date().getUTCDate() - 1));
        var demoLastMonth = new Date(Date.parse(new Date().toISOString().slice(0, 7) + '-01T12:00:00Z') - 9 * DEMO_DAY).toISOString();
        var demoInvoices = { version: 1, stages: ['draft', 'sent', 'paid'], records: [
          { id: 'inv-101', status: 'paid', createdAt: demoDate(-62), updatedAt: demoLastMonth, fields: { client: 'Veld Works', amountCents: 162500, note: 'Spring campaign identity' } },
          { id: 'inv-102', status: 'paid', createdAt: demoDate(-34), updatedAt: demoThisMonth, fields: { client: 'Ostrander & Lee', amountCents: 96000, dueAt: demoDate(-4).slice(0, 10), note: 'Annual report layout' } },
          { id: 'inv-103', status: 'sent', createdAt: demoDate(-34), updatedAt: demoDate(-34), fields: { client: 'Canal House', amountCents: 87500, dueAt: demoDate(-4), note: 'Menu redesign' } },
          { id: 'inv-104', status: 'sent', createdAt: demoDate(-21), updatedAt: demoDate(-21), fields: { client: 'Juniper Press', amountCents: 240000, dueAt: demoDate(9), note: 'Three book covers' } },
          { id: 'inv-105', status: 'draft', createdAt: demoDate(-1), updatedAt: demoDate(-1), fields: { client: 'Northwind Studio', amountCents: 125000, dueAt: demoDate(30).slice(0, 10), note: 'Website copy edit' } },
        ] };
        // The same rules as the office-store script: cents throughout, ids max + 1.
        function demoOffice() {
          var now = Date.now(), month = new Date(now).toISOString().slice(0, 7), outstanding = 0, overdue = 0, paidMonth = 0;
          demoInvoices.records.forEach(function (r) {
            var cents = r.fields.amountCents || 0;
            if (r.status === 'sent') { outstanding += cents; var due = r.fields.dueAt ? Date.parse(r.fields.dueAt) : NaN; if (isFinite(due) && due < now) overdue += 1; }
            if (r.status === 'paid' && r.updatedAt.slice(0, 7) === month) paidMonth += cents;
          });
          return { invoices: demoInvoices.records.length, outstandingCents: outstanding, overdue: overdue, paidMonthCents: paidMonth };
        }
        function demoRecord(input) {
          var cents = typeof input.amount === 'number' && isFinite(input.amount) && input.amount > 0 ? Math.round(input.amount * 100) : null;
          if (!input.client || cents === null) throw new Error('Enter a client and a positive amount.');
          var max = demoInvoices.records.reduce(function (n, r) { var m = /^inv-(\d+)$/.exec(r.id); return m ? Math.max(n, Number(m[1])) : n; }, 0);
          var at = new Date().toISOString(), fields = { client: String(input.client), amountCents: cents };
          if (input.due) fields.dueAt = String(input.due);
          if (input.note) fields.note = String(input.note);
          demoInvoices.records.push({ id: 'inv-' + (max + 1), status: 'draft', createdAt: at, updatedAt: at, fields: fields });
          return demoOffice();
        }
        function demoMove(stage) {
          return function (input) {
            var r = demoInvoices.records.find(function (r) { return r.id === input.id; });
            if (!r) throw new Error('Choose an invoice.');
            r.status = stage;
            r.updatedAt = new Date().toISOString();
            return demoOffice();
          };
        }

        window.gezel || window.makeDemoGezel({
          page: { entry: 'dashboard/index.html', typeName: 'Freelance Office', params: { business: 'freelance design' } },
          tools: {
            page_record_invoice: demoRecord,
            record_invoice: demoRecord,
            page_invoice_sent: demoMove('sent'),
            invoice_sent: demoMove('sent'),
            page_invoice_paid: demoMove('paid'),
            invoice_paid: demoMove('paid'),
            office_status: function () { return demoOffice(); },
            list_invoices: function () { return Object.assign(demoOffice(), { records: demoInvoices.records.length }); },
          },
          data: {
            'invoices.json': function () { return demoInvoices; },
          },
          chat: window.demoChat,
        });

        // ── one code path from here: window.gezel exists in every mode ──
        var demoMode = gezel.page.mode === 'demo';

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        appSubscriptions.push(gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); }));

        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function fmt(cents) { var abs = Math.abs(cents); return (cents < 0 ? '-' : '') + String(Math.floor(abs / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + String(abs % 100).padStart(2, '0'); }
        function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

        function render(book) {
          var records = Array.isArray(book.records) ? book.records : [];
          var now = Date.now();
          var month = new Date().toISOString().slice(0, 7);
          var outstanding = 0, overdue = 0, paidMonth = 0;
          records.forEach(function (r) {
            var cents = (r.fields && r.fields.amountCents) || 0;
            if (r.status === 'sent') {
              outstanding += cents;
              var due = r.fields && r.fields.dueAt ? Date.parse(r.fields.dueAt) : NaN;
              if (isFinite(due) && due < now) overdue += 1;
            }
            if (r.status === 'paid' && r.updatedAt.slice(0, 7) === month) paidMonth += cents;
          });
          document.getElementById('sub').textContent = records.length + (records.length === 1 ? ' invoice' : ' invoices') + ' in the book';
          document.getElementById('t-out').textContent = fmt(outstanding);
          document.getElementById('t-over').textContent = overdue;
          document.getElementById('t-paid').textContent = fmt(paidMonth);
          document.getElementById('empty').hidden = records.length > 0;

          document.getElementById('board').innerHTML = STAGES.map(function (stage) {
            var here = records.filter(function (r) { return r.status === stage; });
            var cards = here.map(function (r) {
              var due = r.fields && r.fields.dueAt ? Date.parse(r.fields.dueAt) : NaN;
              var isOver = stage === 'sent' && isFinite(due) && due < now;
              var when = stage === 'paid' && r.updatedAt
                ? ' · paid ' + esc(String(r.updatedAt).slice(0, 10))
                : r.fields && r.fields.dueAt ? ' · due ' + esc(String(r.fields.dueAt).slice(0, 10)) : '';
              return '<div class="card"><div class="co">' + esc((r.fields && r.fields.client) || r.id) +
                (isOver ? '<span class="chip">overdue</span>' : '') + '</div><div class="amt">' +
                fmt((r.fields && r.fields.amountCents) || 0) + when + '</div>' +
                (r.fields && r.fields.note ? '<div class="note">' + esc(String(r.fields.note)) + '</div>' : '') +
                '</div>';
            }).join('');
            // Stable heading ids keep the section links working after each repaint.
            return '<div class="col"><div class="col-head"><h2 id="stage-' + stage + '">' + cap(stage) + '</h2><span class="count">' + here.length + '</span></div>' + cards + '</div>';
          }).join('');
        }

        window.addEventListener('gezel-app-data-changed', function(){ loadBook(); });
        function loadBook(){
var revision=++appLoadRevision;
return Promise.all([gezel.data.read('invoices.json')]).then(function(values){if(appDisposed||revision!==appLoadRevision)return;reportAppError(null);render(values[0]||{});}).catch(function(error){if(!appDisposed&&revision===appLoadRevision)reportAppError(error);});
}

        loadBook();
        appSubscriptions.push(gezel.data.watch('invoices.json', function () { loadBook(); }));
      })();
    </script>
  <script src="application.js" defer></script>
  </body>
</html>
