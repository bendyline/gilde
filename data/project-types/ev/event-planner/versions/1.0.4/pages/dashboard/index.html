<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Event planner</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2; --card: #fff; --ink: #2b2620; --muted: #7a7166;
        --accent: #b5651d; --track: #ece5da; --good: #4a7c59; --warn: #a4552e;
      }
      :root[data-theme='dark'] {
        --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
        --accent: #e0894a; --track: #3a352f; --good: #7fae8d; --warn: #d98a63;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
          --accent: #e0894a; --track: #3a352f; --good: #7fae8d; --warn: #d98a63;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 var(--font-body, system-ui, sans-serif); background: var(--bg); color: var(--ink); padding: 1.5rem 1.25rem; }
      main { max-width: 680px; margin: 0 auto; }
      h1 { font-family: var(--font-heading, Georgia, serif); font-size: 1.35rem; font-weight: 600; margin: 0 0 0.15rem; }
      .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.9rem; }
      .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; margin-bottom: 0.9rem; }
      .tile { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.7rem 0.85rem; }
      .tile .n { font-size: 1.35rem; font-weight: 700; color: var(--accent); }
      .tile .n.good { color: var(--good); }
      .tile .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
      .panel { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.85rem 1rem; font-size: 0.9rem; }
      .panel h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 0.5rem; }
      .panel ul { margin: 0; padding-left: 1.05rem; }
      .panel li { margin: 0.2rem 0; }
      .rsvp { color: var(--muted); font-size: 0.78rem; }
      .rsvp.yes { color: var(--good); }
      .rsvp.no { color: var(--warn); }
      .bar-row { display: grid; grid-template-columns: 6.5rem 1fr 4.5rem; gap: 0.5rem; align-items: center; margin: 0.3rem 0; }
      .bar { background: var(--track); border-radius: 4px; height: 10px; overflow: hidden; }
      .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
      .amt { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
      .empty { color: var(--muted); font-style: italic; }
      @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } .tiles { grid-template-columns: 1fr 1fr; } }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-banner strong { font-weight: 700; }
      .demo-reset {
        flex: none;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      .demo-reset:hover { border-color: var(--ink); }
    </style>
  <style>
 [hidden]{display:none!important}body{font-family:var(--font-body,system-ui,sans-serif);line-height:1.5}h1,h2,h3{font-family:var(--font-heading,Georgia,serif)}button,input,select,textarea{font-family:var(--font-ui,system-ui,sans-serif)}:focus-visible{outline:3px solid var(--accent,#a65334);outline-offset:3px}main{min-width:0}.app-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:24px 0;align-items:start}.app-search{margin:20px 0;max-width:540px}.app-problem{padding:12px;border:1px solid currentColor;border-radius:6px;overflow-wrap:anywhere}.app-section-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.app-section-nav a{padding:8px 12px;border:1px solid var(--border,#92816a);border-radius:6px;color:inherit;text-decoration:none;font-size:14px}.app-section-nav a:hover{background:color-mix(in srgb,currentColor 8%,transparent)}html[data-gezel-fullscreen=true] main>h1{font-size:clamp(28px,3vw,40px);margin-top:0}html[data-gezel-fullscreen=true] .board{min-width:0}main section{scroll-margin-top:16px}@media(max-width:620px){main{padding:16px!important}.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.board,.columns{max-width:100%;overflow-x:auto}h1{overflow-wrap:anywhere}button{min-height:40px}}</style>
  <script>
var appDisposed=false,appLoadRevision=0,appSubscriptions=[];
function reportAppError(error){var output=document.getElementById('app-load-error');if(output){output.hidden=!error;output.textContent=error?'Could not refresh this view. '+(error.message||'Try again.'):'';}}
window.addEventListener('pagehide',function(){appDisposed=true;appLoadRevision++;appSubscriptions.forEach(function(stop){stop();});},{once:true});
</script></head>
  <body>
    <main>
<p class="app-problem" id="app-load-error" role="status" hidden></p>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong> — sample data stays in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1 id="title">Event planner</h1>
      <p class="sub" id="sub">Loading the plan…</p>
      <div class="tiles">
        <div class="tile"><div class="n" id="t-days">—</div><div class="l">Days to go</div></div>
        <div class="tile"><div class="n good" id="t-coming">—</div><div class="l">Coming</div></div>
        <div class="tile"><div class="n" id="t-await">—</div><div class="l">Awaiting reply</div></div>
        <div class="tile"><div class="n" id="t-spent">—</div><div class="l">Spent</div></div>
      </div>
      <div class="cols">
        <div class="panel">
          <h2>Guest list</h2>
          <ul id="guests"><li class="empty">No guests yet — start the list with your event planner.</li></ul>
        </div>
        <div class="panel">
          <h2>Where the budget went</h2>
          <div id="budget"><p class="empty">Nothing committed yet.</p></div>
        </div>
      </div>
    </main>
    <script>
      (function () {
        'use strict';

        // ── demo plan (used only when the page opens as a raw file) ──
        var demoGuests = {
          eventDate: new Date(Date.now() + 28 * 86400000).toISOString(),
          records: [
            { id: 'guest-1', status: 'yes', fields: { name: 'Mara & Jo', party: 2 } },
            { id: 'guest-2', status: 'yes', fields: { name: 'The De Vries family', party: 4 } },
            { id: 'guest-3', status: 'invited', fields: { name: 'Samir Patel', party: 1 } },
            { id: 'guest-4', status: 'invited', fields: { name: 'Anika Bose', party: 2 } },
            { id: 'guest-5', status: 'no', fields: { name: 'Leo Martins', party: 1 } },
          ],
        };
        var demoBudget = { entries: [
          { kind: 'out', category: 'Venue', amountCents: 185000 },
          { kind: 'out', category: 'Food', amountCents: 92000 },
          { kind: 'out', category: 'Flowers', amountCents: 36000 },
          { kind: 'out', category: 'Music', amountCents: 54000 },
        ] };

        window.gezel || window.makeDemoGezel({
          page: { entry: 'dashboard/index.html', typeName: 'Event Planner', params: { occasion: 'a big celebration', date: '2026-12-31' } },
          tools: {
"page_add_guest": function(input) { demoGuests.records.push({id:'guest-'+(demoGuests.records.length+1),status:'invited',fields:{name:input.name,party:input.party,note:input.note}}); return {saved:true}; },
"page_guest_status": function(input) { var r=demoGuests.records.find(function(r){return r.id===input.id;});if(!r)throw new Error('Choose a guest.');r.status=input.status; return {saved:true}; },
"page_record_spend": function(input) { demoBudget.entries.push({kind:'out',amountCents:Math.round(input.amount*100),category:input.category,note:input.note}); return {saved:true}; }
},
data: {
            'guests.json': function () { return demoGuests; },
            'budget.json': function () { return demoBudget; },
          },
        });

        // ── one code path from here: window.gezel exists in every mode ──
        var demoMode = gezel.page.mode === 'demo';

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        appSubscriptions.push(gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); }));

        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function fmt(cents) { var abs = Math.abs(cents); return (cents < 0 ? '-' : '') + Math.floor(abs / 100) + '.' + String(abs % 100).padStart(2, '0'); }
        function partyOf(r) { var p = r.fields && r.fields.party; return typeof p === 'number' && p >= 1 ? Math.floor(p) : 1; }

        function render(guestsDoc, budgetDoc) {
          var records = (guestsDoc && guestsDoc.records) || [];
          var entries = (budgetDoc && budgetDoc.entries) || [];
          var coming = 0, awaiting = 0;
          records.forEach(function (r) {
            if (r.status === 'yes') coming += partyOf(r);
            if (r.status === 'invited') awaiting += partyOf(r);
          });
          var spent = 0; var byCat = {};
          entries.forEach(function (e) {
            if (e.kind === 'out') { spent += e.amountCents; byCat[e.category] = (byCat[e.category] || 0) + e.amountCents; }
          });
          var days = guestsDoc && guestsDoc.eventDate ? Math.ceil((Date.parse(guestsDoc.eventDate) - Date.now()) / 86400000) : null;

          document.getElementById('sub').textContent =
            (guestsDoc && guestsDoc.eventDate ? 'The day: ' + String(guestsDoc.eventDate).slice(0, 10) + ' · ' : '') +
            records.length + ' invitation(s) on the list';
          document.getElementById('t-days').textContent = days === null || !isFinite(days) ? '—' : Math.max(0, days);
          document.getElementById('t-coming').textContent = coming;
          document.getElementById('t-await').textContent = awaiting;
          document.getElementById('t-spent').textContent = fmt(spent);

          if (records.length) {
            document.getElementById('guests').innerHTML = records.map(function (r) {
              return '<li>' + esc((r.fields && r.fields.name) || r.id) + (partyOf(r) > 1 ? ' (+' + (partyOf(r) - 1) + ')' : '') +
                ' <span class="rsvp ' + r.status + '">' + (r.status === 'invited' ? 'awaiting' : r.status) + '</span></li>';
            }).join('');
          }
          var cats = Object.entries(byCat).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6);
          if (cats.length) {
            var max = cats[0][1];
            document.getElementById('budget').innerHTML = cats.map(function (pair) {
              return '<div class="bar-row"><span>' + esc(pair[0]) + '</span><span class="bar"><span style="width:' + Math.max(4, Math.round((pair[1] / max) * 100)) + '%"></span></span><span class="amt">' + fmt(pair[1]) + '</span></div>';
            }).join('');
          }
        }

        window.addEventListener('gezel-app-data-changed', function(){ loadPlan(); });
        function loadPlan(){
var revision=++appLoadRevision;
return Promise.all([gezel.data.read('guests.json'),gezel.data.read('budget.json')]).then(function(values){if(appDisposed||revision!==appLoadRevision)return;reportAppError(null);render(values[0]||{},values[1]||{});}).catch(function(error){if(!appDisposed&&revision===appLoadRevision)reportAppError(error);});
}

        loadPlan();
        appSubscriptions.push(gezel.data.watch('guests.json', function () { loadPlan(); }));
        appSubscriptions.push(gezel.data.watch('budget.json', function () { loadPlan(); }));
      })();
    </script>
  <script src="application.js" defer></script>
  </body>
</html>
