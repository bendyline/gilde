<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Household manual</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2; --card: #fff; --ink: #2b2620; --muted: #7a7166;
        --accent: #b5651d; --track: #ece5da; --good: #4a7c59; --warn: #a4552e;
      }
      :root[data-theme='dark'] {
        --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
        --accent: #e0894a; --track: #3a352f; --good: #7fae8d; --warn: #d98a63;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
          --accent: #e0894a; --track: #3a352f; --good: #7fae8d; --warn: #d98a63;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 var(--font-body, system-ui, sans-serif); background: var(--bg); color: var(--ink); padding: 1.5rem 1.25rem; }
      main { max-width: 640px; margin: 0 auto; }
      h1 { font-family: var(--font-heading, Georgia, serif); font-size: 1.35rem; font-weight: 600; margin: 0 0 0.15rem; }
      .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.9rem; }
      .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 0.9rem; }
      .tile { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.7rem 0.85rem; }
      .tile .n { font-size: 1.35rem; font-weight: 700; color: var(--accent); }
      .tile .n.warn { color: var(--warn); }
      .tile .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .list { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.5rem 0; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 0.6rem; padding: 0.45rem 1rem; font-size: 0.9rem; align-items: baseline; }
      .row + .row { border-top: 1px solid var(--track); }
      .row .where { color: var(--muted); font-size: 0.78rem; }
      .chip { display: inline-block; border: 1px solid var(--track); border-radius: 4px; padding: 0 0.3rem; font-size: 0.7rem; line-height: 1.4; margin-left: 0.3rem; }
      .chip.due { color: var(--accent); border-color: var(--accent); }
      .chip.attention { color: var(--warn); border-color: var(--warn); }
      .row .issue { display: block; color: var(--warn); font-size: 0.8rem; margin-top: 0.1rem; }
      .empty { color: var(--muted); font-style: italic; padding: 0.85rem 1rem; }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-banner strong { font-weight: 700; }
      .demo-reset {
        flex: none;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      .demo-reset:hover { border-color: var(--ink); }
    </style>
  <style>
 [hidden]{display:none!important}body{font-family:var(--font-body,system-ui,sans-serif);line-height:1.5}h1,h2,h3{font-family:var(--font-heading,Georgia,serif)}button,input,select,textarea{font-family:var(--font-ui,system-ui,sans-serif)}:focus-visible{outline:3px solid var(--accent,#a65334);outline-offset:3px}main{min-width:0}.app-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:24px 0;align-items:start}.app-search{margin:20px 0;max-width:540px}.app-problem{padding:12px;border:1px solid currentColor;border-radius:6px;overflow-wrap:anywhere}.app-section-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.app-section-nav a{padding:8px 12px;border:1px solid var(--border,#92816a);border-radius:6px;color:inherit;text-decoration:none;font-size:14px}.app-section-nav a:hover{background:color-mix(in srgb,currentColor 8%,transparent)}html[data-gezel-fullscreen=true] main>h1{font-size:clamp(28px,3vw,40px);margin-top:0}html[data-gezel-fullscreen=true] .board{min-width:0}main section{scroll-margin-top:16px}@media(max-width:620px){main{padding:16px!important}.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.board,.columns{max-width:100%;overflow-x:auto}h1{overflow-wrap:anywhere}button{min-height:40px}}</style>
  <script>
var appDisposed=false,appLoadRevision=0,appSubscriptions=[];
function reportAppError(error){var output=document.getElementById('app-load-error');if(output){output.hidden=!error;output.textContent=error?'Could not refresh this view. '+(error.message||'Try again.'):'';}}
window.addEventListener('pagehide',function(){appDisposed=true;appLoadRevision++;appSubscriptions.forEach(function(stop){stop();});},{once:true});
</script></head>
  <body>
    <main>
<p class="app-problem" id="app-load-error" role="status" hidden></p>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong> — sample data stays in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1>Household manual</h1>
      <p class="sub" id="sub">Loading the system cards…</p>
      <div class="tiles">
        <div class="tile"><div class="n" id="t-sys">—</div><div class="l">Systems</div></div>
        <div class="tile"><div class="n" id="t-due">—</div><div class="l">Care due</div></div>
        <div class="tile"><div class="n warn" id="t-flag">—</div><div class="l">Flagged</div></div>
      </div>
      <div class="list" id="list"><p class="empty">No systems yet — tell your home keeper about the furnace.</p></div>
    </main>
    <script src="demo-chat.js"></script>
    <script>
      (function () {
        'use strict';
        var DAY = 24 * 60 * 60 * 1000;

        // ── demo manual (used only when the page opens as a raw file) ──
        function demoAgo(days) { return new Date(Date.now() - days * DAY).toISOString(); }
        function demoCard(id, status, created, fields, note) {
          var history = [{ at: demoAgo(created), from: null, to: 'ok' }];
          if (status === 'attention') history.push({ at: demoAgo(2), from: 'ok', to: 'attention', note: note });
          return { id: id, status: status, createdAt: demoAgo(created), updatedAt: history[history.length - 1].at, fields: fields, history: history };
        }
        var demoHouse = { records: [
          demoCard('sys-1', 'ok', 400, { name: 'Furnace filter', kind: 'utility', location: 'Basement', care: 'Replace the filter', intervalDays: 90, lastDoneAt: demoAgo(97) }),
          demoCard('sys-2', 'ok', 380, { name: 'Smoke alarms', kind: 'safety', location: 'Each floor', care: 'Test and note batteries', intervalDays: 30, lastDoneAt: demoAgo(9) }),
          demoCard('sys-3', 'attention', 700, { name: 'Water heater', kind: 'appliance', location: 'Garage', care: 'Flush the sediment', intervalDays: 365, lastDoneAt: demoAgo(200) }, 'Pilot light went out twice this week.'),
          demoCard('sys-4', 'ok', 500, { name: 'Water shutoff', kind: 'utility', location: 'Basement, behind the furnace', care: 'Keep access clear; turn it once a year' }),
          demoCard('sys-5', 'ok', 300, { name: 'Range hood filter', kind: 'appliance', location: 'Kitchen', care: 'Wash the filter', intervalDays: 60, lastDoneAt: demoAgo(67) }),
          demoCard('sys-6', 'ok', 420, { name: 'Gutters', kind: 'structure', location: 'Roof edge', care: 'Clear leaves and check the downspouts', intervalDays: 180, lastDoneAt: demoAgo(160) }),
          demoCard('sys-7', 'ok', 600, { name: 'Dryer vent', kind: 'appliance', location: 'Laundry room', care: 'Clean the vent duct', intervalDays: 365, lastDoneAt: demoAgo(300) }),
        ] };

        window.gezel || window.makeDemoGezel({
          page: { entry: 'dashboard/index.html', typeName: 'Household Manual', params: { home: 'our home' } },
          tools: (function () {
            // Mirrors the house-store script: a system by id or exact name, history notes, ok -> attention.
            function find(input) {
              var r = input.id ? demoHouse.records.find(function (x) { return x.id === input.id; })
                : input.name ? demoHouse.records.find(function (x) { return String(x.fields.name).toLowerCase() === String(input.name).toLowerCase(); }) : null;
              if (!r) throw new Error('Choose a system.');
              return r;
            }
            function move(r, to, note) {
              var at = new Date().toISOString(), entry = { at: at, from: r.status, to: to };
              if (note) entry.note = note;
              r.history = (r.history || []).concat([entry]);
              r.status = to;
              r.updatedAt = at;
            }
            function status() {
              var now = Date.now(), due = [], flagged = [];
              demoHouse.records.forEach(function (r) {
                var f = r.fields, last = Date.parse(f.lastDoneAt || r.createdAt);
                if (f.intervalDays > 0 && now - last >= f.intervalDays * DAY) due.push(f.name);
                if (r.status === 'attention') flagged.push(f.name);
              });
              var bits = [];
              if (due.length) bits.push('care due: ' + due.join(', '));
              if (flagged.length) bits.push('flagged: ' + flagged.join(', '));
              return { systems: demoHouse.records.length, due: due.length, flagged: flagged.length,
                summary: demoHouse.records.length + ' system(s) on record. ' + (bits.length ? bits.join('; ') + '.' : 'Nothing due — the house is quiet.') };
            }
            return {
              page_record_system: function (input) {
                if (!input.name || !String(input.name).trim()) throw new Error('Name the system or appliance.');
                var fields = { name: String(input.name).trim() };
                ['kind', 'location', 'care'].forEach(function (key) { if (input[key]) fields[key] = String(input[key]); });
                if (typeof input.intervalDays === 'number' && input.intervalDays > 0) fields.intervalDays = input.intervalDays;
                fields.lastDoneAt = new Date().toISOString();
                var at = fields.lastDoneAt, max = demoHouse.records.reduce(function (n, r) { return Math.max(n, Number(r.id.slice(4)) || 0); }, 0);
                demoHouse.records.push({ id: 'sys-' + (max + 1), status: 'ok', createdAt: at, updatedAt: at, fields: fields, history: [{ at: at, from: null, to: 'ok' }] });
                return status();
              },
              page_log_maintenance: function (input) {
                var r = find(input);
                r.fields.lastDoneAt = new Date().toISOString();
                move(r, 'ok', input.note);
                return status();
              },
              page_flag_attention: function (input) {
                if (!input.note) throw new Error('Say what needs attention.');
                move(find(input), 'attention', input.note);
                return status();
              },
              house_status: function () { return status(); },
            };
          })(),
          data: {
            'systems.json': function () { return demoHouse; },
          },
          chat: window.demoChat,
        });

        // ── one code path from here: window.gezel exists in every mode ──
        var demoMode = gezel.page.mode === 'demo';

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        appSubscriptions.push(gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); }));

        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function isDue(r, now) {
          var f = r.fields || {};
          if (typeof f.intervalDays !== 'number' || f.intervalDays <= 0) return false;
          var last = typeof f.lastDoneAt === 'string' ? Date.parse(f.lastDoneAt) : Date.parse(r.createdAt);
          return isFinite(last) && now - last >= f.intervalDays * DAY;
        }

        function render(house) {
          var records = Array.isArray(house.records) ? house.records : [];
          var now = Date.now();
          var due = records.filter(function (r) { return isDue(r, now); });
          var flagged = records.filter(function (r) { return r.status === 'attention'; });
          document.getElementById('sub').textContent =
            records.length === 0 ? 'An empty manual — the house has secrets to record.'
              : due.length + flagged.length === 0 ? 'The house is quiet. Nothing due.'
              : 'The house needs a little care.';
          document.getElementById('t-sys').textContent = records.length;
          document.getElementById('t-due').textContent = due.length;
          document.getElementById('t-flag').textContent = flagged.length;

          if (records.length) {
            document.getElementById('list').innerHTML = records
              .slice()
              .sort(function (a, b) {
                var pa = (a.status === 'attention' ? 0 : isDue(a, now) ? 1 : 2);
                var pb = (b.status === 'attention' ? 0 : isDue(b, now) ? 1 : 2);
                return pa - pb;
              })
              .map(function (r) {
                var f = r.fields || {};
                var issue = r.status === 'attention' && Array.isArray(r.history)
                  ? r.history.slice().reverse().find(function (h) { return h.to === 'attention' && h.note; })
                  : null;
                var years = f.intervalDays && f.intervalDays % 365 === 0 ? f.intervalDays / 365 : 0;
                var every = !f.intervalDays ? '' : years === 1 ? ' once a year' : years ? ' every ' + years + ' years'
                  : ' every ' + f.intervalDays + (f.intervalDays === 1 ? ' day' : ' days');
                return '<div class="row"><span>' + esc(f.name || r.id) +
                  (f.location ? '<span class="where"> — ' + esc(f.location) + '</span>' : '') +
                  (f.care ? '<span class="where"> · ' + esc(f.care) + every + '</span>' : every ? '<span class="where"> ·' + every + '</span>' : '') +
                  (issue ? '<span class="issue">' + esc(issue.note) + '</span>' : '') +
                  '</span><span>' +
                  (r.status === 'attention' ? '<span class="chip attention">attention</span>' : '') +
                  (isDue(r, now) ? '<span class="chip due">due</span>' : '') +
                  '</span></div>';
              })
              .join('');
          }
        }

        window.addEventListener('gezel-app-data-changed', function(){ loadManual(); });
        function loadManual(){
var revision=++appLoadRevision;
return Promise.all([gezel.data.read('systems.json')]).then(function(values){if(appDisposed||revision!==appLoadRevision)return;reportAppError(null);render(values[0]||{});}).catch(function(error){if(!appDisposed&&revision===appLoadRevision)reportAppError(error);});
}

        loadManual();
        appSubscriptions.push(gezel.data.watch('systems.json', function () { loadManual(); }));
      })();
    </script>
  <script src="application.js" defer></script>
  </body>
</html>
