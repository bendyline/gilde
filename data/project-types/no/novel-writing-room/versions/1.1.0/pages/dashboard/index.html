<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Novel Writing Room</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2; --card: #fff; --ink: #2b2620; --muted: #7a7166;
        --accent: #b5651d; --track: #ece5da; --good: #4a7c59;
      }
      :root[data-theme='dark'] {
        --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
        --accent: #e0894a; --track: #3a352f; --good: #7fae8d;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
          --accent: #e0894a; --track: #3a352f; --good: #7fae8d;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 var(--font-body, system-ui, sans-serif); background: var(--bg); color: var(--ink); padding: 1.5rem 1.25rem; }
      main { max-width: 680px; margin: 0 auto; }
      h1 { font-family: var(--font-heading, Georgia, serif); font-size: 1.35rem; font-weight: 600; margin: 0 0 0.15rem; }
      .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 0.9rem; }
      .pace { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 1rem; margin-bottom: 0.75rem; }
      .pace .total { font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
      .pace .goal { color: var(--muted); font-size: 0.95rem; }
      .pace .all { color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
      .panel { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.75rem; font-size: 0.95rem; }
      .panel h2 { font-family: var(--font-ui, system-ui, sans-serif); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 0.5rem; }
      .panel ul { margin: 0; padding: 0; list-style: none; }
      .panel li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.6rem; padding: 0.4rem 0; border-bottom: 1px solid var(--track); }
      .panel li:last-child { border-bottom: 0; }
      .panel li .what { flex: 1 1 14rem; min-width: 0; }
      .panel li .when { color: var(--muted); font-size: 0.85rem; min-width: 6.5rem; font-variant-numeric: tabular-nums; }
      .panel li .words { font-weight: 600; font-variant-numeric: tabular-nums; }
      .panel li.empty { display: block; border: 0; }
      .key { min-height: 32px; padding: 0.2rem 0.7rem; border: 1px solid color-mix(in srgb, var(--muted) 40%, var(--track)); border-radius: 6px; background: var(--card); color: var(--ink); cursor: pointer; font-family: var(--font-ui, system-ui, sans-serif); font-size: 0.85rem; white-space: nowrap; }
      .key:hover { border-color: var(--ink); }
      .card .key { margin-top: 0.4rem; }
      .panel li .key { align-self: center; }
      .bar { background: var(--track); border-radius: 4px; height: 12px; overflow: hidden; margin-top: 0.6rem; }
      .bar > span { display: block; height: 100%; background: var(--good); border-radius: 4px; transition: width 0.4s ease; }
      .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; }
      .col { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.7rem 0.8rem; min-height: 5.5rem; min-width: 0; }
      .col-head { display: flex; gap: 0.35rem; align-items: baseline; margin: 0 0 0.45rem; font-family: var(--font-ui, system-ui, sans-serif); font-size: 0.75rem; }
      .col-head h2 { font-family: inherit; font-weight: 600; font-size: inherit; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0; }
      .col-head .count { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
      .card { border: 1px solid var(--track); border-radius: 6px; padding: 0.45rem 0.55rem; margin: 0.3rem 0; font-size: 0.9rem; overflow-wrap: anywhere; }
      .card .t { font-weight: 600; }
      .card .sum, .card .note { color: var(--muted); font-size: 0.85rem; line-height: 1.4; margin-top: 0.2rem; }
      .card .note { font-style: italic; }
      .empty { color: var(--muted); font-style: italic; font-size: 0.85rem; }
      @media (max-width: 640px) { .board { grid-template-columns: 1fr 1fr; } }
      @media (max-width: 480px) { .board { grid-template-columns: 1fr; } }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-banner strong { font-weight: 700; }
      .demo-reset {
        flex: none;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      .demo-reset:hover { border-color: var(--ink); }
    </style>
  <style>
 [hidden]{display:none!important}body{font-family:var(--font-body,system-ui,sans-serif);line-height:1.5}h1,h2,h3{font-family:var(--font-heading,Georgia,serif)}button,input,select,textarea{font-family:var(--font-ui,system-ui,sans-serif)}:focus-visible{outline:3px solid var(--accent,#a65334);outline-offset:3px}main{min-width:0}.app-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:24px 0;align-items:start}.app-search{margin:20px 0;max-width:540px}.app-problem{padding:12px;border:1px solid currentColor;border-radius:6px;overflow-wrap:anywhere}.app-section-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.app-section-nav a{padding:8px 12px;border:1px solid var(--border,#92816a);border-radius:6px;color:inherit;text-decoration:none;font-size:14px}.app-section-nav a:hover{background:color-mix(in srgb,currentColor 8%,transparent)}html[data-gezel-fullscreen=true] main>h1{font-size:clamp(28px,3vw,40px);margin-top:0}html[data-gezel-fullscreen=true] .board{min-width:0}main section{scroll-margin-top:16px}@media(max-width:620px){main{padding:16px!important}.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.board,.columns{max-width:100%;overflow-x:auto}h1{overflow-wrap:anywhere}button{min-height:40px}}</style>
    <style data-app-shell="2">
    /* Shared app furniture from the Gezel app UX guide. The page owns everything else. */
    :root{--app-action:var(--gezel-component-accent,#805128);--app-on-action:#fffaf3;--app-banner-bg:#f3eddf;--app-banner-line:#d6cbb8}
    :root[data-theme=dark]{--app-action:var(--gezel-component-accent,#e0b78b);--app-on-action:#1f1a16;--app-banner-bg:#25221f;--app-banner-line:#4a4238}
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--app-action:var(--gezel-component-accent,#e0b78b);--app-on-action:#1f1a16;--app-banner-bg:#25221f;--app-banner-line:#4a4238}}
    main h1{font-weight:400}
    html[data-gezel-fullscreen=true] main h1{font-size:clamp(28px,3vw,40px);margin-top:0}
    .app-tabs{margin:20px 0 24px}
    .app-actionbar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;margin:16px 0 24px}
    .app-panel>.app-actionbar:first-child{margin-top:0}
    .app-settings{display:grid;gap:16px;max-width:760px;margin:0 0 24px}
    .app-search{margin:0}
    .app-search gezel-collection-filter{margin:0 0 12px;max-width:540px}
    .app-primary{min-height:44px;padding:8px 16px;border:1px solid var(--app-action);border-radius:6px;background:var(--app-action);color:var(--app-on-action);font-weight:600}
    .app-primary:disabled{display:none}
    main li.empty{display:block;grid-column:1/-1}
    html[data-app-legacy] [data-app-action]{display:none!important}
    [data-gezel-demo-banner]:not([hidden]){display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 16px;padding:8px 8px 8px 14px;border:1px solid var(--app-banner-line);border-radius:10px;background:var(--app-banner-bg);color:inherit;font-size:14px;line-height:1.4}
    [data-gezel-demo-banner] button{min-height:32px;padding:4px 12px;border:1px solid var(--app-banner-line);border-radius:6px;background:transparent;color:inherit;font-size:13px}
    @media(max-width:620px){.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}:is(.tiles,.stats,.summary):has(>:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))!important}:is(.tiles,.stats,.summary):has(>:only-child){grid-template-columns:minmax(0,1fr)!important}}
    </style>
  <script>
var appDisposed=false,appLoadRevision=0,appSubscriptions=[];
function reportAppError(error){var output=document.getElementById('app-load-error');if(output){output.hidden=!error;output.textContent=error?'Could not refresh this view. '+(error.message||'Try again.'):'';}}
window.addEventListener('pagehide',function(){appDisposed=true;appLoadRevision++;appSubscriptions.forEach(function(stop){stop();});},{once:true});
</script></head>
  <body>
    <main>
<p class="app-problem" id="app-load-error" role="status" hidden></p>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong> — sample data stays in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1 id="title">Novel Writing Room</h1>
      <p class="sub" id="sub">Loading the manuscript…</p>
      <section class="pace" id="pace-section">
        <div class="total" id="total">—</div>
        <div class="goal" id="goal">words this week</div>
        <div class="bar"><span id="bar" style="width: 0%"></span></div>
        <div class="all" id="all-words"></div>
      </section>
      <section class="panel" id="drafting-section">
        <h2>Now drafting</h2>
        <ul id="drafting"><li class="empty">No chapter is in drafting.</li></ul>
      </section>
      <div class="board" id="board"></div>
      <section class="panel" id="sessions-section">
        <h2>Writing sessions</h2>
        <ul id="sessions"><li class="empty">No sessions logged yet.</li></ul>
      </section>
    </main>
    <script src="demo-chat.js"></script>
    <script>
      (function () {
        'use strict';
        var STAGES = ['outline', 'drafting', 'revised', 'done'];

        // ── demo manuscript (used only when the page opens as a raw file) ──
        // Dated back from today, in the same shapes the manuscript-store script writes.
        var DEMO_DAY = 86400000;
        function demoAt(days) { return new Date(Date.now() - days * DEMO_DAY).toISOString(); }
        var demoSessions = {
          version: 1,
          title: 'The Glass Cartographer',
          weeklyWordGoal: 5000,
          events: [
            [12, 900, 'Chapter 2 revision: cut the opening paragraph'],
            [9, 1150, 'Chapter 2: the bell-jar streets'],
            [6, 850, 'Opened chapter 3 at the dock at dusk'],
            [3, 1200, 'Oskar’s first scene. Too much backstory?'],
            [0, 640, 'The bargain scene; stopped mid-dialogue'],
          ].map(function (s) { return { at: demoAt(s[0]), kind: 'writing', note: s[2], data: { words: s[1] } }; }),
        };
        function demoChapter(id, status, title, summary, days, note) {
          var history = [{ at: demoAt(days + 20), from: null, to: 'outline' }];
          if (status !== 'outline') history.push({ at: demoAt(days), from: 'outline', to: status });
          if (note) history.push({ at: demoAt(days), from: status, to: status, note: note });
          return { id: id, status: status, fields: { title: title, summary: summary }, createdAt: history[0].at, updatedAt: history[history.length - 1].at, history: history };
        }
        var demoChapters = { version: 1, stages: ['outline', 'drafting', 'revised', 'done'], records: [
          demoChapter('ch-1', 'done', 'The map that changed overnight', 'Ilse, apprentice to the cartographer of Vell, wakes to find the harbor redrawn on her master’s map. By noon the real harbor has moved to match.', 30),
          demoChapter('ch-2', 'revised', 'A city folded into glass', 'Following the map’s new lines, Ilse finds whole streets kept under bell jars at the glassworks, and learns her master sold the old harbor.', 9),
          demoChapter('ch-3', 'drafting', 'The ferryman’s bargain', 'Oskar the ferryman will row Ilse past the glass line, for a price he won’t name until they are on the water.', 3, 'Stuck on what he asks for.'),
          demoChapter('ch-4', 'outline', 'North of the last road', 'Ilse and Oskar walk into the blank part of the map. Something there is drawing them.', 20),
          demoChapter('ch-5', 'outline', 'The unfinished coast', 'The coast is still being drawn. Ilse meets the hand that holds the pen.', 20),
        ] };
        // The same rules as the manuscript-store script: weeks start Monday UTC, ids max + 1.
        function demoNovel() {
          var start = Date.parse(new Date().toISOString().slice(0, 10) + 'T00:00:00Z') - ((new Date().getUTCDay() + 6) % 7) * DEMO_DAY;
          var total = 0, week = 0;
          demoSessions.events.forEach(function (e) { var w = Number(e.data.words) || 0; total += w; if (Date.parse(e.at) >= start) week += w; });
          return { totalWords: total, thisWeekWords: week, chapters: demoChapters.records.length };
        }
        function demoLogSession(input) {
          var words = Number(input.words);
          if (!isFinite(words) || words <= 0) throw new Error('Enter how many words you wrote.');
          var event = { at: new Date().toISOString(), kind: 'writing', data: { words: Math.round(words) } };
          if (input.note) event.note = String(input.note);
          demoSessions.events.push(event);
          return demoNovel();
        }
        function demoAddChapter(input) {
          if (!input.title) throw new Error('Give the chapter a title.');
          var max = demoChapters.records.reduce(function (n, r) { var m = /^ch-(\d+)$/.exec(r.id); return m ? Math.max(n, Number(m[1])) : n; }, 0);
          var at = new Date().toISOString(), fields = { title: String(input.title) };
          if (input.summary) fields.summary = String(input.summary);
          demoChapters.records.push({ id: 'ch-' + (max + 1), status: 'outline', fields: fields, createdAt: at, updatedAt: at, history: [{ at: at, from: null, to: 'outline' }] });
          return demoNovel();
        }
        function demoChapterStage(input) {
          var r = demoChapters.records.find(function (r) { return r.id === input.id; });
          if (!r) throw new Error('Choose a chapter.');
          if (demoChapters.stages.indexOf(input.stage) < 0) throw new Error('Choose a stage: outline, drafting, revised, or done.');
          var at = new Date().toISOString(), entry = { at: at, from: r.status, to: input.stage };
          if (input.note) entry.note = String(input.note);
          r.history = (r.history || []).concat([entry]);
          r.status = input.stage;
          r.updatedAt = at;
          return demoNovel();
        }

        window.gezel || window.makeDemoGezel({
          page: { entry: 'dashboard/index.html', typeName: 'Novel Writing Room', params: { title: 'The Glass Cartographer', weeklyWordGoal: 5000 } },
          tools: {
            page_log_session: demoLogSession,
            log_session: demoLogSession,
            page_add_chapter: demoAddChapter,
            add_chapter: demoAddChapter,
            page_chapter_stage: demoChapterStage,
            chapter_stage: demoChapterStage,
            novel_status: function () { return demoNovel(); },
            outline: function () { return demoNovel(); },
          },
          data: {
            'sessions.json': function () { return demoSessions; },
            'chapters.json': function () { return demoChapters; },
          },
          chat: window.demoChat,
        });

        // ── one code path from here: window.gezel exists in every mode ──
        var demoMode = gezel.page.mode === 'demo';

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        appSubscriptions.push(gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); }));

        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function fmtNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
        function weekStartMs(nowIso) {
          var d = new Date(nowIso.slice(0, 10) + 'T00:00:00Z');
          return d.getTime() - ((d.getUTCDay() + 6) % 7) * 86400000;
        }
        var STAGE_LABELS = { outline: 'Outline', drafting: 'Drafting', revised: 'Revised', done: 'Done' };
        function node(tag, text, className) { var n = document.createElement(tag); if (text !== undefined) n.textContent = text; if (className) n.className = className; return n; }
        function dayText(value) {
          var d = new Date(value);
          return isFinite(d.getTime()) ? d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : String(value);
        }
        // "Move" opens "Move a chapter" with the chapter and its next stage chosen.
        function moveKey(r) {
          var title = String((r.fields && r.fields.title) || 'this chapter');
          var next = STAGES[Math.min(STAGES.length - 1, STAGES.indexOf(r.status) + 1)] || r.status;
          var key = node('button', 'Move', 'key');
          key.type = 'button';
          key.setAttribute('aria-label', 'Move ' + title + ' to another stage');
          key.setAttribute('data-app-action', 'chapter_stage');
          key.setAttribute('data-app-values', JSON.stringify({ id: r.id, stage: next }));
          return key;
        }
        function wordsOf(e) {
          var w = e && e.data ? Number(e.data.words) : NaN;
          return isFinite(w) && w > 0 ? Math.round(w) : 0;
        }

        function render(sessions, chapters) {
          var events = Array.isArray(sessions.events) ? sessions.events : [];
          var records = Array.isArray(chapters.records) ? chapters.records : [];
          var goal = Number(sessions.weeklyWordGoal);
          if (!isFinite(goal) || goal <= 0) goal = 0;
          var total = 0;
          events.forEach(function (e) { total += wordsOf(e); });
          var start = weekStartMs(new Date().toISOString());
          var week = 0;
          events.forEach(function (e) { if (Date.parse(e.at) >= start) week += wordsOf(e); });

          if (sessions.title) document.getElementById('title').textContent = sessions.title;
          document.getElementById('sub').textContent = records.length + (records.length === 1 ? ' chapter' : ' chapters') + ' on the board, ' +
            events.length + (events.length === 1 ? ' session' : ' sessions') + ' logged';
          // One measure leads: this week against the goal. The all-time total is a footnote.
          document.getElementById('total').textContent = fmtNum(week);
          document.getElementById('goal').textContent = (goal > 0 ? 'of ' + fmtNum(goal) + ' words' : 'words') + ' this week';
          document.getElementById('all-words').textContent = fmtNum(total) + ' words in all';
          document.getElementById('bar').style.width = (goal > 0 ? Math.min(100, Math.round((week / goal) * 100)) : week > 0 ? 100 : 0) + '%';

          var board = document.getElementById('board');
          board.replaceChildren.apply(board, STAGES.map(function (stage) {
            var here = records.filter(function (r) { return r.status === stage; });
            var col = node('div', undefined, 'col'), head = node('div', undefined, 'col-head'), h2 = node('h2', STAGE_LABELS[stage] || stage);
            // Stable heading ids keep the section links working after each repaint.
            h2.id = 'stage-' + stage;
            head.append(h2, node('span', String(here.length), 'count'));
            col.append(head);
            here.forEach(function (r) {
              var summary = r.fields && r.fields.summary ? String(r.fields.summary) : '';
              var noted = (Array.isArray(r.history) ? r.history : []).filter(function (h) { return h && h.note; }).pop();
              var card = node('div', undefined, 'card');
              card.append(node('div', String((r.fields && r.fields.title) || 'Untitled chapter'), 't'));
              if (summary) card.append(node('div', summary, 'sum'));
              if (noted) card.append(node('div', 'Note: ' + String(noted.note), 'note'));
              card.append(moveKey(r));
              col.append(card);
            });
            if (!here.length) col.append(node('div', stage === 'outline' ? 'Ask your writing partner to put chapters on the board.' : 'None yet.', 'empty'));
            return col;
          }));

          var drafting = records.filter(function (r) { return r.status === 'drafting'; });
          var draftList = document.getElementById('drafting');
          draftList.replaceChildren.apply(draftList, drafting.length ? drafting.map(function (r) {
            var li = node('li'), what = node('span', undefined, 'what');
            what.append(node('strong', String((r.fields && r.fields.title) || 'Untitled chapter')));
            var noted = (Array.isArray(r.history) ? r.history : []).filter(function (h) { return h && h.note; }).pop();
            if (noted) what.append(node('span', ' · ' + String(noted.note), 'when'));
            li.append(what, moveKey(r));
            return li;
          }) : [node('li', 'No chapter is in drafting.', 'empty')]);

          var sessionList = document.getElementById('sessions');
          sessionList.replaceChildren.apply(sessionList, events.length ? events.slice().reverse().map(function (e) {
            var li = node('li');
            li.append(node('span', dayText(e.at), 'when'), node('span', fmtNum(wordsOf(e)) + ' words', 'words'), node('span', e.note ? String(e.note) : '', 'what'));
            return li;
          }) : [node('li', 'No sessions logged yet.', 'empty')]);
        }

        window.addEventListener('gezel-app-data-changed', function(){ loadRoom(); });
        function loadRoom(){
var revision=++appLoadRevision;
return Promise.all([gezel.data.read('sessions.json'),gezel.data.read('chapters.json')]).then(function(values){if(appDisposed||revision!==appLoadRevision)return;reportAppError(null);render(values[0]||{},values[1]||{});}).catch(function(error){if(!appDisposed&&revision===appLoadRevision)reportAppError(error);});
}

        loadRoom();
        appSubscriptions.push(gezel.data.watch('sessions.json', function () { loadRoom(); }));
        appSubscriptions.push(gezel.data.watch('chapters.json', function () { loadRoom(); }));
      })();
    </script>
  <script src="application.js" defer></script>
  </body>
</html>
