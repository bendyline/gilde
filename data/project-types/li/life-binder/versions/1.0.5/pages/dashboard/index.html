<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Life binder</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2; --card: #fff; --ink: #2b2620; --muted: #7a7166;
        --accent: #b5651d; --track: #ece5da; --good: #4a7c59; --warn: #a4552e;
      }
      :root[data-theme='dark'] {
        --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
        --accent: #e0894a; --track: #3a352f; --good: #7fae8d; --warn: #d98a63;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
          --accent: #e0894a; --track: #3a352f; --good: #7fae8d; --warn: #d98a63;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 var(--font-body, system-ui, sans-serif); background: var(--bg); color: var(--ink); padding: 1.5rem 1.25rem; }
      main { max-width: 620px; margin: 0 auto; }
      h1 { font-family: var(--font-heading, Georgia, serif); font-size: 1.35rem; font-weight: 600; margin: 0 0 0.15rem; }
      .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.9rem; }
      .meter { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.75rem; }
      .meter .line { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.4rem; }
      .bar { background: var(--track); border-radius: 4px; height: 10px; overflow: hidden; }
      .bar > span { display: block; height: 100%; background: var(--good); border-radius: 4px; transition: width 0.3s ease; }
      .list { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.5rem 0; }
      .row { display: grid; grid-template-columns: 1.4rem 1fr auto; gap: 0.6rem; align-items: baseline; padding: 0.45rem 1rem; font-size: 0.9rem; }
      .row + .row { border-top: 1px solid var(--track); }
      .mark { font-weight: 700; text-align: center; }
      .row.present .mark { color: var(--good); }
      .row.missing .mark { color: var(--warn); }
      .row .where { color: var(--muted); font-size: 0.78rem; }
      .chip { display: inline-block; border: 1px solid var(--warn); color: var(--warn); border-radius: 4px; padding: 0 0.3rem; font-size: 0.7rem; line-height: 1.4; }
      .privacy { color: var(--muted); font-size: 0.78rem; text-align: center; margin-top: 0.75rem; }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-banner strong { font-weight: 700; }
      .demo-reset {
        flex: none;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      .demo-reset:hover { border-color: var(--ink); }
    </style>
  <style>
 [hidden]{display:none!important}body{font-family:var(--font-body,system-ui,sans-serif);line-height:1.5}h1,h2,h3{font-family:var(--font-heading,Georgia,serif)}button,input,select,textarea{font-family:var(--font-ui,system-ui,sans-serif)}:focus-visible{outline:3px solid var(--accent,#a65334);outline-offset:3px}main{min-width:0}.app-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:24px 0;align-items:start}.app-search{margin:20px 0;max-width:540px}.app-problem{padding:12px;border:1px solid currentColor;border-radius:6px;overflow-wrap:anywhere}.app-section-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.app-section-nav a{padding:8px 12px;border:1px solid var(--border,#92816a);border-radius:6px;color:inherit;text-decoration:none;font-size:14px}.app-section-nav a:hover{background:color-mix(in srgb,currentColor 8%,transparent)}html[data-gezel-fullscreen=true] main>h1{font-size:clamp(28px,3vw,40px);margin-top:0}html[data-gezel-fullscreen=true] .board{min-width:0}main section{scroll-margin-top:16px}@media(max-width:620px){main{padding:16px!important}.tiles,.stats,.summary{grid-template-columns:repeat(2,minmax(0,1fr))!important}.board,.columns{max-width:100%;overflow-x:auto}h1{overflow-wrap:anywhere}button{min-height:40px}}</style>
  <script>
var appDisposed=false,appLoadRevision=0,appSubscriptions=[];
function reportAppError(error){var output=document.getElementById('app-load-error');if(output){output.hidden=!error;output.textContent=error?'Could not refresh this view. '+(error.message||'Try again.'):'';}}
window.addEventListener('pagehide',function(){appDisposed=true;appLoadRevision++;appSubscriptions.forEach(function(stop){stop();});},{once:true});
</script></head>
  <body>
    <main>
<p class="app-problem" id="app-load-error" role="status" hidden></p>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong> — sample data stays in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1>Life binder</h1>
      <p class="sub" id="sub">Loading the checklist…</p>
      <div class="meter">
        <div class="line"><span id="m-label">—</span><span id="m-count">—</span></div>
        <div class="bar"><span id="m-bar" style="width: 0%"></span></div>
      </div>
      <div class="list" id="list"></div>
      <p class="privacy">Locations, never contents.</p>
    </main>
    <script>
      (function () {
        'use strict';
        var YEAR = 365 * 24 * 60 * 60 * 1000;

        // ── demo checklist (used only when the page opens as a raw file) ──
        var demoBinder = { records: [
          { id: 'doc-1', status: 'present', updatedAt: new Date(Date.now() - 40 * 86400000).toISOString(), fields: { name: 'Will', location: 'Blue fire box', reviewedAt: new Date(Date.now() - 40 * 86400000).toISOString() } },
          { id: 'doc-2', status: 'present', updatedAt: new Date(Date.now() - 420 * 86400000).toISOString(), fields: { name: 'Home insurance', location: 'Blue fire box', reviewedAt: new Date(Date.now() - 420 * 86400000).toISOString() } },
          { id: 'doc-3', status: 'missing', updatedAt: new Date().toISOString(), fields: { name: 'Emergency contacts' } },
          { id: 'doc-4', status: 'present', updatedAt: new Date(Date.now() - 20 * 86400000).toISOString(), fields: { name: 'Passport copies', location: 'Travel folder' } },
          { id: 'doc-5', status: 'missing', updatedAt: new Date().toISOString(), fields: { name: 'Pet care instructions' } },
        ] };

        window.gezel || window.makeDemoGezel({
          page: { entry: 'dashboard/index.html', typeName: 'Life Binder', params: { household: 'our family' } },
          tools: {
"page_record_document": function(input) { var r=demoBinder.records.find(function(r){return r.fields.name.toLowerCase()===input.name.toLowerCase();});if(!r){r={id:'doc-'+(demoBinder.records.length+1),fields:{}};demoBinder.records.push(r);}r.fields={name:input.name,location:input.location,note:input.note};r.status='present';r.updatedAt=new Date().toISOString(); return {saved:true}; },
"page_mark_reviewed": function(input) { var r=demoBinder.records.find(function(r){return r.id===input.id;});if(!r)throw new Error('Choose a document.');r.fields.reviewedAt=new Date().toISOString(); return {saved:true}; },
"page_mark_missing": function(input) { var r=demoBinder.records.find(function(r){return r.id===input.id;});if(!r)throw new Error('Choose a document.');r.status='missing'; return {saved:true}; }
},
data: {
            'documents.json': function () { return demoBinder; },
          },
        });

        // ── one code path from here: window.gezel exists in every mode ──
        var demoMode = gezel.page.mode === 'demo';

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        appSubscriptions.push(gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); }));

        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

        function render(binder) {
          var records = Array.isArray(binder.records) ? binder.records : [];
          var present = records.filter(function (r) { return r.status === 'present'; });
          var now = Date.now();
          document.getElementById('sub').textContent =
            present.length === records.length && records.length > 0
              ? 'Everything in place. Well done.'
              : (records.length - present.length) + ' gap(s) to close.';
          document.getElementById('m-label').textContent = 'In place';
          document.getElementById('m-count').textContent = present.length + ' of ' + records.length;
          document.getElementById('m-bar').style.width =
            (records.length ? Math.round((present.length / records.length) * 100) : 0) + '%';

          document.getElementById('list').innerHTML = records
            .slice()
            .sort(function (a, b) { return a.status === b.status ? 0 : a.status === 'missing' ? -1 : 1; })
            .map(function (r) {
              var f = r.fields || {};
              var reviewed = typeof f.reviewedAt === 'string' ? Date.parse(f.reviewedAt) : Date.parse(r.updatedAt);
              var stale = r.status === 'present' && isFinite(reviewed) && now - reviewed > YEAR;
              return (
                '<div class="row ' + r.status + '"><span class="mark">' + (r.status === 'present' ? '+' : '-') + '</span>' +
                '<span>' + esc(f.name || r.id) +
                (f.location ? '<span class="where"> — ' + esc(f.location) + '</span>' : '') + '</span>' +
                '<span>' + (stale ? '<span class="chip">review due</span>' : '') + '</span></div>'
              );
            })
            .join('');
        }

        window.addEventListener('gezel-app-data-changed', function(){ loadBinder(); });
        function loadBinder(){
var revision=++appLoadRevision;
return Promise.all([gezel.data.read('documents.json')]).then(function(values){if(appDisposed||revision!==appLoadRevision)return;reportAppError(null);render(values[0]||{});}).catch(function(error){if(!appDisposed&&revision===appLoadRevision)reportAppError(error);});
}

        loadBinder();
        appSubscriptions.push(gezel.data.watch('documents.json', function () { loadBinder(); }));
      })();
    </script>
  <script src="application.js" defer></script>
  </body>
</html>
