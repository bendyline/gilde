<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="gezel-demo" content="standalone" />
    <title>Fitness Coach</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f2; --card: #fff; --ink: #2b2620; --muted: #7a7166;
        --accent: #b5651d; --track: #ece5da; --good: #4a7c59;
      }
      :root[data-theme='dark'] {
        --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
        --accent: #e0894a; --track: #3a352f; --good: #7fae8d;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #1c1a17; --card: #262320; --ink: #efe9e0; --muted: #a59a8c;
          --accent: #e0894a; --track: #3a352f; --good: #7fae8d;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--ink); padding: 1.5rem 1.25rem; }
      main { max-width: 620px; margin: 0 auto; }
      h1 { font-family: Georgia, 'PT Serif', 'Times New Roman', serif; font-size: 1.35rem; font-weight: 600; margin: 0 0 0.15rem; }
      .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.9rem; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.75rem; }
      .stat { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.85rem 1rem; }
      .stat .num { font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
      .stat .num.good { color: var(--good); }
      .stat .lbl { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
      .week { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.75rem; }
      .week h2, .recent h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 0.5rem; }
      .dots { display: flex; gap: 0.4rem; }
      .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--track); }
      .dot.hit { background: var(--good); }
      .week .note { color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem; }
      .recent { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.85rem 1rem; font-size: 0.9rem; }
      .recent ul { margin: 0; padding-left: 1.05rem; }
      .recent li { margin: 0.25rem 0; }
      .recent .when { color: var(--muted); font-variant-numeric: tabular-nums; }
      .empty { color: var(--muted); font-style: italic; }
      .panel { background: var(--card); border: 1px solid var(--track); border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.75rem; }
      .panel h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 0.5rem; }
      .log-row { display: grid; grid-template-columns: minmax(0, 1fr) 6.5rem; gap: 0.5rem; }
      .log-row input {
        font: inherit; color: var(--ink); background: var(--bg);
        border: 1px solid var(--track); border-radius: 6px; padding: 0.5rem; min-height: 44px; width: 100%;
      }
      .quick { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
      button {
        font: inherit; color: var(--ink); background: var(--card);
        border: 1px solid var(--track); border-radius: 6px; min-height: 44px; padding: 0.35rem 0.8rem; cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { border-color: var(--good); color: var(--good); }
      .status { color: var(--muted); font-size: 0.85rem; margin: 0.4rem 0 0; }
      .status.best { color: var(--good); font-weight: 600; }
      .recap p { margin: 0.2rem 0; }
      .demo-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin: 0 0 0.85rem;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: color-mix(in srgb, var(--card) 88%, var(--accent));
        color: var(--ink);
        font-size: 0.8rem;
      }
      .demo-banner[hidden] { display: none; }
      .demo-banner strong { font-weight: 700; }
      .demo-reset {
        flex: none;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
      }
      .demo-reset:hover { border-color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <div class="demo-banner" data-gezel-demo-banner hidden>
        <span><strong>Demo mode</strong> — sample data stays in this page.</span>
        <button type="button" class="demo-reset" onclick="location.reload()">Reset demo</button>
      </div>
      <h1 id="title">Fitness Coach</h1>
      <p class="sub" id="sub">Loading the training log…</p>
      <div class="panel">
        <h2>Log a session</h2>
        <div class="log-row">
          <input id="activity" type="text" maxlength="60" placeholder="What did you do?" aria-label="Activity" />
          <input id="minutes" type="number" min="1" max="600" inputmode="numeric" placeholder="Minutes" aria-label="Minutes" />
        </div>
        <div class="quick" id="quick"></div>
        <button type="button" class="primary" id="log">Log it</button>
        <p class="status" id="log-status" role="status"></p>
      </div>
      <div class="stats">
        <div class="stat"><div class="num good" id="streak">—</div><div class="lbl">Day streak</div></div>
        <div class="stat"><div class="num" id="total">—</div><div class="lbl">Sessions all time</div></div>
      </div>
      <div class="week">
        <h2>This week</h2>
        <div class="dots" id="dots"></div>
        <div class="note" id="weekNote"></div>
      </div>
      <div class="panel recap">
        <h2>Weekly recap</h2>
        <div id="recap"><p class="empty">No recap yet.</p></div>
        <button type="button" id="ask-recap">Write this week's recap</button>
        <p class="status" id="recap-status" role="status"></p>
      </div>
      <div class="recent">
        <h2>Recent sessions</h2>
        <ul id="recent"><li class="empty">Nothing logged yet — tell your Coach about your first session.</li></ul>
      </div>
    </main>
    <script>
/* gezel-page-demo-stub v1 */
/*
 * The canonical demo stub for Gezel type pages. MIT License.
 *
 * Paste this file's bytes verbatim into a <script> block ahead of the
 * page's own code, then call makeDemoGezel({ page, tools, data }) with the
 * page's demo handlers. Served by Gezel, the real window.gezel is already
 * injected and the stub steps aside; opened as a raw file (the live demos
 * on gezelgilde.com), it installs a window.gezel whose tools and data are
 * the page-supplied handler maps — one code path in every mode. `tools`
 * and `data` map a tool name / declared read path to a function; data
 * handlers back read() and list(), and url() returns the handler's value
 * or passes a data: URI through. See docs/page-authoring.md.
 */
(function () {
  'use strict';
  window.makeDemoGezel = function (opts) {
    if (window.gezel) return window.gezel;
    var page = (opts && opts.page) || {};
    var tools = (opts && opts.tools) || {};
    var data = (opts && opts.data) || {};
    var themeListeners = [];
    var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var ui = {
      theme: { mode: media && media.matches ? 'dark' : 'light' },
      onTheme: function (cb) {
        themeListeners.push(cb);
        return function () {
          var at = themeListeners.indexOf(cb);
          if (at >= 0) themeListeners.splice(at, 1);
        };
      },
    };
    if (media && media.addEventListener) {
      media.addEventListener('change', function (ev) {
        ui.theme = { mode: ev.matches ? 'dark' : 'light' };
        themeListeners.slice().forEach(function (cb) { cb(ui.theme); });
      });
    }
    function fail(code, message) {
      var err = new Error(message);
      err.code = code;
      return Promise.reject(err);
    }
    function run(map, key, arg) {
      if (!Object.prototype.hasOwnProperty.call(map, key)) return null;
      return Promise.resolve().then(function () { return map[key](arg); });
    }
    window.gezel = {
      page: {
        api: 1,
        projectId: 'demo',
        source: 'type',
        entry: page.entry || 'index.html',
        typeName: page.typeName || 'demo',
        params: page.params || {},
        mode: 'demo',
      },
      tools: {
        list: function () { return Promise.resolve(Object.keys(tools)); },
        invoke: function (name, input) {
          var call = run(tools, name, input || {});
          if (!call) return fail('not-allowed', "The demo does not handle the tool '" + name + "'.");
          return call.then(function (output) { return { output: output }; });
        },
      },
      data: {
        read: function (path, o) {
          return run(data, path, o || {}) || fail('not-allowed', "The demo has no data for '" + path + "'.");
        },
        list: function (path, o) {
          return run(data, path, o || {}) || Promise.resolve([]);
        },
        watch: function () { return function () {}; },
        url: function (path) {
          if (Object.prototype.hasOwnProperty.call(data, path)) return String(data[path]({}));
          return typeof path === 'string' && path.indexOf('data:') === 0 ? path : '';
        },
      },
      ui: ui,
      refresh: function () {},
    };
    return window.gezel;
  };
})();
    </script>
    <script>
      (function () {
        'use strict';
        var DAY = 86400000;

        // ── demo log (used only when the page opens as a raw file) ──
        var demoTraining = {
          goal: 'a comfortable 10K',
          weeklyTarget: 4,
          events: [
            { at: new Date(Date.now() - 6 * DAY).toISOString(), data: { activity: 'Easy run', minutes: 32 } },
            { at: new Date(Date.now() - 4 * DAY).toISOString(), data: { activity: 'Mobility and strength', minutes: 25 } },
            { at: new Date(Date.now() - 2 * DAY).toISOString(), data: { activity: 'Tempo intervals', minutes: 38 } },
            { at: new Date().toISOString(), data: { activity: 'Recovery walk', minutes: 28 } },
          ],
        };

        var demoRecap = {
          weekOf: new Date(Date.now() - 7 * DAY).toISOString().slice(0, 10),
          sessions: 3, target: 4, minutes: 95, sessionsChange: 1, minutesChange: 20,
          suggestion: 'Add one easy 20-minute run midweek to reach four sessions.',
        };

        makeDemoGezel({
          page: { entry: 'dashboard/index.html', typeName: 'Fitness Coach', params: { goal: 'feeling strong and consistent', weeklyTarget: 3 } },
          tools: {
            page_log_workout: function (input) {
              var minutes = Number(input.minutes) || 0;
              var best = demoTraining.events.every(function (e) { return (e.data.minutes || 0) < minutes; });
              demoTraining.events.push({ at: new Date().toISOString(), data: { activity: input.activity, minutes: minutes } });
              return { personalBest: best && minutes > 0 };
            },
            request_recap: function () { return { status: 'recap_wanted' }; },
          },
          data: {
            'training.json': function () { return demoTraining; },
            'recaps/latest.json': function () { return demoRecap; },
          },
        });

        // ── one code path from here: window.gezel exists in every mode ──
        var demoMode = gezel.page.mode === 'demo';

        function applyTheme(mode) {
          document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'dark' : 'light');
        }
        applyTheme(gezel.ui.theme.mode);
        gezel.ui.onTheme(function (theme) { applyTheme(theme.mode); });

        if (demoMode) document.querySelector('[data-gezel-demo-banner]').hidden = false;

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function utcDay(iso) { return iso.slice(0, 10); }
        function weekStartMs(nowIso) {
          var d = new Date(nowIso.slice(0, 10) + 'T00:00:00Z');
          return d.getTime() - ((d.getUTCDay() + 6) % 7) * DAY;
        }
        function streakDays(events) {
          if (!events.length) return 0;
          var days = {};
          var last = null;
          events.forEach(function (e) { days[utcDay(e.at)] = true; if (last === null || e.at > last) last = e.at; });
          var streak = 0;
          var cursor = Date.parse(utcDay(last) + 'T00:00:00Z');
          while (days[new Date(cursor).toISOString().slice(0, 10)]) { streak += 1; cursor -= DAY; }
          return streak;
        }

        function render(doc) {
          var events = Array.isArray(doc.events) ? doc.events : [];
          var target = Number(doc.weeklyTarget);
          if (!isFinite(target) || target <= 0) target = 0;
          if (doc.goal) document.getElementById('title').textContent = 'Training toward: ' + doc.goal;
          document.getElementById('sub').textContent = events.length ? events.length + ' session(s) on record' : 'The record starts with the first session.';
          document.getElementById('streak').textContent = String(streakDays(events));
          document.getElementById('total').textContent = String(events.length);

          var start = weekStartMs(new Date().toISOString());
          var week = events.filter(function (e) { return Date.parse(e.at) >= start; }).length;
          var slots = Math.max(target, week, 1);
          var dots = '';
          for (var i = 0; i < slots; i++) dots += '<span class="dot' + (i < week ? ' hit' : '') + '"></span>';
          document.getElementById('dots').innerHTML = dots;
          document.getElementById('weekNote').textContent = target > 0
            ? week + ' of ' + target + ' session(s)' + (week >= target ? ' — target met.' : '.')
            : week + ' session(s) this week.';

          if (events.length) {
            document.getElementById('recent').innerHTML = events.slice(-8).reverse().map(function (e) {
              var mins = e.data && isFinite(Number(e.data.minutes)) && Number(e.data.minutes) > 0 ? ' (' + Number(e.data.minutes) + ' min)' : '';
              return '<li><span class="when">' + esc(utcDay(e.at)) + '</span> ' + esc((e.data && e.data.activity) || 'session') + mins + '</li>';
            }).join('');
          }
        }

        function loadTraining() {
          return gezel.data
            .read('training.json')
            .then(function (next) { if (next) render(next); })
            .catch(function () {});
        }

        ['Run', 'Walk', 'Gym', 'Cycle', 'Swim', 'Yoga'].forEach(function (name) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = name;
          b.onclick = function () { document.getElementById('activity').value = name; };
          document.getElementById('quick').appendChild(b);
        });

        function unavailable(err, where) {
          return err && err.code === 'unavailable'
            ? where + ' happens in the app’s Output pane.'
            : (err && err.message) || 'That did not work. Try again.';
        }

        document.getElementById('log').onclick = function () {
          var activity = document.getElementById('activity').value.trim();
          var minutes = Number(document.getElementById('minutes').value);
          var status = document.getElementById('log-status');
          status.className = 'status';
          if (!activity) { status.textContent = 'Say what you did first.'; return; }
          var input = { activity: activity };
          if (minutes > 0) input.minutes = minutes;
          gezel.tools
            .invoke('page_log_workout', input)
            .then(function (res) {
              var best = res && res.output && res.output.personalBest;
              status.className = best ? 'status best' : 'status';
              status.textContent = best ? 'Logged. That is your longest session yet.' : 'Logged.';
              document.getElementById('activity').value = '';
              document.getElementById('minutes').value = '';
              return loadTraining();
            })
            .catch(function (err) { status.textContent = unavailable(err, 'Logging'); });
        };

        function renderRecap(r) {
          if (!r) return;
          var change = r.minutesChange === 0 ? 'same as last week' : (r.minutesChange > 0 ? '+' : '') + r.minutesChange + ' min vs last week';
          document.getElementById('recap').innerHTML =
            '<p><strong>Week of ' + esc(r.weekOf) + '</strong></p>' +
            '<p>' + r.sessions + (r.target ? ' of ' + r.target : '') + ' session(s), ' + r.minutes + ' min (' + esc(change) + ').</p>' +
            (r.suggestion ? '<p>Next week: ' + esc(r.suggestion) + '</p>' : '');
        }
        function loadRecap() {
          return gezel.data.read('recaps/latest.json').then(renderRecap).catch(function () {});
        }

        document.getElementById('ask-recap').onclick = function () {
          var status = document.getElementById('recap-status');
          status.textContent = '';
          gezel.tools
            .invoke('request_recap', {})
            .then(function () {
              status.textContent = demoMode ? 'In the app, your coach writes it here.' : 'Your coach is writing it. It appears here when ready.';
            })
            .catch(function (err) { status.textContent = unavailable(err, 'Asking for a recap'); });
        };

        loadTraining();
        loadRecap();
        gezel.data.watch('training.json', function () { loadTraining(); });
        gezel.data.watch('recaps/latest.json', function () { loadRecap(); });
      })();
    </script>
  </body>
</html>
